# YOLO Dual-Backbone Regression Training - GPU 0
#
# Architecture:
#   Backbone 1 (FROZEN): Classification encoder + heads from Stage 1
#     → bin predictions via argmax
#   Backbone 2 (TRAINABLE, from scratch): Same Mamba architecture
#     → processes the same hit sequence independently
#     → learns its own representation for high-resolution offset regression
#
# Offsets (same as unified):
#   eta: linear (truth - center)
#   phi: wrapped via atan2
#   pt:  log-space (log(truth/center))
#
# The regression backbone has the same architecture as the classification
# backbone (dim=128, 2-layer Mamba2, head_hidden_dim=512) so it has equal
# capacity, but learns a completely independent representation.
#
# Stage 1 checkpoint: SSorting, epoch 199
#   eta=501, phi=100, pt=50 (log), sort_by=s, head_hidden_dim=512

seed_everything: 42
name: YOLO-DualBackbone-Regression-GPU0

data:
  train_dir: /scratch/ml_training_data_2694000_regression_true_hits_only
  val_dir: /scratch/ml_validation_data_144000_regression_true_hits_only
  test_dir: /scratch/ml_test_156000_regression_hdf5_true_hits_only

  num_workers: 24
  num_train: -1
  num_val: -1
  num_test: -1
  batch_size: 1024

  # ===== S-SORTING (must match Stage 1 checkpoint) =====
  sort_by: s

  min_hits_per_track: 2
  max_hits_per_track: 200
  event_max_num_particles: 10

  hit_fields:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  inputs:
    hit:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  targets:
    particle:
      - truthMuon_pt
      - truthMuon_q
      - truthMuon_eta
      - truthMuon_phi

trainer:
  max_epochs: 200
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs/YOLO
  gradient_clip_val: 1.0
  enable_progress_bar: true

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: yolo_dual_backbone_regression

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 10
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 25
        min_delta: 0.0
        mode: min
        verbose: true

model:
  name: YOLO-DualBackbone-Regression
  optimizer: AdamW

  lrs_config:
    initial: 1e-5
    max: 1e-4
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  # ===== STAGE 1 CHECKPOINT (frozen classification backbone) =====
  stage1_checkpoint: /shared/tracking/hepattn_muon/src/logs/YOLO/YOLO-Stage1-Classification-PhysicsInformed-SSorting-GPU0_20260205-T215741/ckpts/epoch=199-val_loss=25.46230.ckpt

  # Bin configuration (must match Stage 1)
  bin_dir: /scratch/ml_training_data_2694000_regression_true_hits_only/bins
  eta_bins: &eta_bins 501
  phi_bins: &phi_bins 100
  pt_bins: &pt_bins 50
  pt_log_bins: true
  use_inv_pt: false

  # Clipping ranges (must match Stage 1)
  pt_min: 5.0
  pt_max: 200.0
  eta_min: -2.7
  eta_max: 2.7
  eta_gap_min: -0.1
  eta_gap_max: 0.1

  # ===== REGRESSION BACKBONE (same architecture as classification) =====
  input_dim: 27
  reg_dim: 128          # Same as cls backbone dim
  reg_num_layers: 2     # Same as cls backbone num_layers
  reg_d_state: 16       # Same as cls backbone d_state
  reg_d_conv: 4         # Same as cls backbone d_conv
  reg_expand: 2         # Same as cls backbone expand
  reg_use_mamba2: true   # Same as cls backbone
  reg_headdim: 32       # Same as cls backbone headdim
  reg_norm: RMSNorm      # Same as cls backbone norm
  reg_dropout: 0.0       # Same as cls backbone dropout

  # ===== REGRESSION HEADS (same size as classification heads) =====
  reg_head_hidden_dim: 512   # Same as cls head_hidden_dim
  reg_head_dropout: 0.15     # Same as cls head_dropout

  # ===== LOSS CONFIGURATION =====
  smooth_l1_beta: 0.1
  eta_loss_weight: 1.0
  phi_loss_weight: 1.0
  pt_loss_weight: 1.0

  # ===== CLASSIFICATION MODEL (frozen backbone) =====
  # Must match Stage 1 checkpoint architecture EXACTLY
  cls_model:
    class_path: hepattn.models.yolo_regressor.YOLORegressor
    init_args:
      input_dim: 27
      dim: 128
      num_layers: 2
      d_state: 16
      d_conv: 4
      expand: 2
      use_mamba2: true
      headdim: 32
      norm: RMSNorm
      dropout: 0.0
      head_dropout: 0.15
      head_hidden_dim: 512

      # Classification bins (must match Stage 1)
      eta_bins: *eta_bins
      phi_bins: *phi_bins
      pt_bins: *pt_bins

      use_attention_pooling: false
      enable_regression_heads: false
