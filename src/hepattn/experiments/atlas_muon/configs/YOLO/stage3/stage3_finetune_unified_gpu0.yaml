# YOLO Stage 3: Joint Finetuning - GPU 0
#
# End-to-end finetuning with ALL parameters unfrozen:
#   - SSM (Mamba2) encoder: UNFROZEN
#   - Classification heads: UNFROZEN
#   - Regression heads (external): UNFROZEN
#
# Starting from Stage 2 unified regression checkpoint (epoch 5).
# Lower learning rate to avoid catastrophic forgetting.
# Regression loss only (Smooth L1 on scalar offsets).
#
# Architecture: eta=501, phi=100, pt=50 (log), sort_by=s, head_hidden_dim=512

seed_everything: 42
name: YOLO-Stage3-Finetune-Unified-GPU0

data:
  train_dir: /scratch/ml_training_data_2694000_regression_true_hits_only
  val_dir: /scratch/ml_validation_data_144000_regression_true_hits_only
  test_dir: /scratch/ml_test_156000_regression_hdf5_true_hits_only

  num_workers: 24
  num_train: -1
  num_val: -1
  num_test: -1
  batch_size: 1024

  # ===== S-SORTING (must match Stage 1 & 2) =====
  sort_by: s

  min_hits_per_track: 2
  max_hits_per_track: 200
  event_max_num_particles: 10
     
  hit_fields:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  inputs:
    hit:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  targets:
    particle:
      - truthMuon_pt
      - truthMuon_q
      - truthMuon_eta
      - truthMuon_phi

trainer:
  max_epochs: 100
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs/YOLO
  gradient_clip_val: 1.0
  enable_progress_bar: true

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: yolo_regression_stage3

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 10
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 15
        min_delta: 0.0
        mode: min
        verbose: true

model:
  optimizer: AdamW
  
  # Lower LR for finetuning to avoid catastrophic forgetting
  lrs_config:
    initial: 1e-6
    max: 5e-5
    end: 1e-7
    pct_start: 0.05
    weight_decay: 1e-5

  # ===== STAGE 2 CHECKPOINT (loads model + regression heads) =====
  stage2_checkpoint: /shared/tracking/hepattn_muon/src/logs/YOLO/YOLO-Stage2-Regression-Unified-GPU0_20260206-T163959/ckpts/epoch=005-val_loss=0.00434.ckpt

  # Bin configuration (must match Stage 1 & 2)
  bin_dir: /scratch/ml_training_data_2694000_regression_true_hits_only/bins
  eta_bins: &eta_bins 501
  phi_bins: &phi_bins 100
  pt_bins: &pt_bins 50
  pt_log_bins: true
  use_inv_pt: false

  # Clipping ranges
  pt_min: 5.0
  pt_max: 200.0
  eta_min: -2.7
  eta_max: 2.7
  eta_gap_min: -0.1
  eta_gap_max: 0.1

  # Regression head config (must match Stage 2)
  reg_hidden_dim: 512
  reg_num_layers: 2
  reg_dropout: 0.15

  # Loss configuration
  smooth_l1_beta: 0.1
  eta_loss_weight: 1.0
  phi_loss_weight: 1.0
  pt_loss_weight: 1.0

  # ===== STAGE 3: UNFREEZE EVERYTHING =====
  freeze_backbone: false

  # Model configuration (must match Stage 1 & 2 EXACTLY)
  model:
    class_path: hepattn.models.yolo_regressor.YOLORegressor
    init_args:
      input_dim: 27
      dim: 128
      num_layers: 2
      d_state: 16
      d_conv: 4
      expand: 2
      use_mamba2: true
      headdim: 32
      norm: RMSNorm
      dropout: 0.0
      head_dropout: 0.15
      head_hidden_dim: 512
      
      # Classification bins (must match Stage 1 & 2)
      eta_bins: *eta_bins
      phi_bins: *phi_bins
      pt_bins: *pt_bins
      
      use_attention_pooling: false
      enable_regression_heads: false
