# YOLO Stage 1: Hierarchical Classification with SCHEDULED Hierarchy Weights
# 
# Features:
#   - Hierarchical multi-resolution classification heads (3 levels)
#     Eta:  L0=51, L1=101, L2=501  (coarse → fine)
#     Phi:  L0=50, L1=100, L2=500
#     Pt:   L0=10, L1=25, L2=50    (in 1/pt space)
#   - 1/pt binning: classifier operates in curvature space
#   - COSINE-SCHEDULED hierarchy weights over training:
#     L0 (coarse): 1.0 → 0.1  (focus coarse early, fade out)
#     L1 (middle): 0.5 constant
#     L2 (fine):   0.1 → 1.0  (ramp up fine precision)
#   - S-sorting for hit ordering
#
# Rationale:
#   Early in training, coarse bins provide easy gradient signal.
#   As training progresses, fine bins become the primary objective.
#   Middle levels stay constant as background regularization.

seed_everything: 42
name: YOLO-Stage1-Hierarchical-Scheduled-GPU0

data:
  train_dir: /scratch/ml_training_data_2694000_regression_true_hits_only
  val_dir: /scratch/ml_validation_data_144000_regression_true_hits_only
  test_dir: /scratch/ml_test_156000_regression_hdf5_true_hits_only

  num_workers: 24
  num_train: -1
  num_val: -1
  num_test: -1
  batch_size: 1024

  sort_by: s

  min_hits_per_track: 2
  max_hits_per_track: 200
  event_max_num_particles: 10
     
  hit_fields:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  inputs:
    hit:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_globPosX
    - spacePoint_globPosY
    - spacePoint_globPosZ
    - spacePoint_driftR
    - spacePoint_time
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - spacePoint_covXX
    - spacePoint_covXY
    - spacePoint_covYX
    - spacePoint_covYY
    - tube_length
    - r
    - s
    - theta
    - phi
    - eta

  targets:
    particle:
      - truthMuon_pt
      - truthMuon_q
      - truthMuon_eta
      - truthMuon_phi

trainer:
  max_epochs: 200
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs/YOLO
  gradient_clip_val: 1.0
  enable_progress_bar: true

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: yolo_classification_stage1

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 20
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20
        min_delta: 0.0
        mode: min
        verbose: true

model:
  optimizer: AdamW
  
  lrs_config:
    initial: 1e-5
    max: 5e-4
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  # ===== Hierarchical bin configuration =====
  bin_dir: /scratch/ml_training_data_2694000_regression_true_hits_only/bins
  eta_bins: &eta_bins [51, 101, 501]
  phi_bins: &phi_bins [50, 100, 500]
  pt_bins:  &pt_bins  [10, 25, 50]
  
  # ===== 1/pT binning =====
  use_inv_pt: true
  
  # ===== HIERARCHY WEIGHT SCHEDULING =====
  # Initial weights (used as starting point for L0/L2, constant for L1)
  hierarchy_loss_weights: [1.0, 0.5, 0.1]
  
  # Enable cosine scheduling of hierarchy weights
  schedule_hierarchy_weights: true
  hierarchy_weight_schedule:
    # L0 (coarsest): fade from 1.0 → 0.1 over training
    coarse_start: 1.0
    coarse_end: 0.1
    # L2 (finest): ramp from 0.1 → 1.0 over training
    fine_start: 0.1
    fine_end: 1.0
    # L1 (middle): stays at hierarchy_loss_weights[1] = 0.5
    schedule_type: cosine  # smooth cosine interpolation
  
  # Loss weights
  eta_loss_weight: 1.0
  phi_loss_weight: 1.0
  pt_loss_weight: 10.0
  charge_loss_weight: 1.0

  use_gaussian_label_smoothing: false
  eta_label_sigma: 0.01
  phi_label_sigma: 0.1
  pt_label_sigma_frac: 0.05

  pt_log_bins: false
  focal_gamma: 2.0
  
  pt_min: 5.0
  pt_max: 200.0
  eta_min: -2.7
  eta_max: 2.7
  eta_gap_min: -0.1
  eta_gap_max: 0.1

  model:
    class_path: hepattn.models.yolo_regressor.YOLORegressor
    init_args:
      input_dim: 27
      dim: 128
      num_layers: 2
      d_state: 16
      d_conv: 4
      expand: 2
      use_mamba2: true
      headdim: 32
      norm: RMSNorm
      dropout: 0.0
      head_dropout: 0.15
      head_hidden_dim: 512
      
      eta_bins: *eta_bins
      phi_bins: *phi_bins
      pt_bins:  *pt_bins
      
      use_inv_pt: true
      use_attention_pooling: false
      enable_regression_heads: false
