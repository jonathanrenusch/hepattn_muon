seed_everything: 42
name: Mamba-Track-Regression-64

# Mamba-based track parameter regression using ground truth hit-to-track assignments
# This is a proof-of-concept for using bidirectional Mamba for track fitting

data:
  # Use the same data directories as the tracking task
  train_dir: /scratch/ml_training_data_2694000_hdf5_filtered_wp0990_maxtrk2_maxhit600
  val_dir: /scratch/ml_validation_data_144000_hdf5_filtered_wp0990_maxtrk2_maxhit600
  test_dir: /scratch/ml_test_data_156000_hdf5_filtered_wp0990_maxtrk2_maxhit600

  num_workers: 24
  num_train: -1  # Start with subset for quick iteration
  num_val: -1
  num_test: -1
  batch_size: 512  # Per-track batching allows larger batches

  # Per-track data loading parameters
  min_hits_per_track: 2
  max_hits_per_track: 200
  event_max_num_particles: 10

  # Hit features to use (18 features)
  hit_fields:
    - spacePoint_globEdgeHighX
    - spacePoint_globEdgeHighY
    - spacePoint_globEdgeHighZ
    - spacePoint_globEdgeLowX
    - spacePoint_globEdgeLowY
    - spacePoint_globEdgeLowZ
    - spacePoint_driftR
    - spacePoint_channel
    - spacePoint_layer
    - spacePoint_stationPhi
    - spacePoint_stationEta
    - spacePoint_stationIndex
    - spacePoint_technology
    - r
    - s
    - theta
    - phi
    - eta

  # Required for base dataset compatibility
  inputs:
    hit:
      - spacePoint_globEdgeHighX
      - spacePoint_globEdgeHighY
      - spacePoint_globEdgeHighZ
      - spacePoint_globEdgeLowX
      - spacePoint_globEdgeLowY
      - spacePoint_globEdgeLowZ
      - spacePoint_driftR
      - spacePoint_channel
      - spacePoint_layer
      - spacePoint_stationPhi
      - spacePoint_stationEta
      - spacePoint_stationIndex
      - spacePoint_technology
      - r
      - s
      - theta
      - phi
      - eta

  targets:
    particle:
      - truthMuon_pt
      - truthMuon_q
      - truthMuon_eta
      - truthMuon_phi

trainer:
  max_epochs: 200
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: true

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: mamba_track_regression

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 5
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20
        min_delta: 0.0
        mode: min
        verbose: true

model:
  optimizer: Lion
  
  # Learning rate schedule


  lrs_config:
    initial: 2e-5
    max: 1e-4
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  # Loss weighting
  # Both regression and classification contribute roughly equally
  regression_weight: 1.0
  classification_weight: 1.0
  
  regression_fields:
    - eta
    - phi
    - pt

  model:
    class_path: hepattn.models.mamba_regressor.MambaTrackRegressor
    init_args:
      # Input dimension = number of hit features
      input_dim: 18
      
      # Model dimension - minimum for Mamba2 CUDA alignment
      dim: 64
      
      # Mamba encoder configuration - minimal for ~4x size reduction
      num_layers: 1    # Single bidirectional layer
      d_state: 16         # Reduced SSM state
      d_conv: 4
      expand: 2
      use_mamba2: true
      headdim: 16
      # norm: LayerNorm
      norm: RMSNorm
      dropout: 0.0           # Mamba encoder dropout (typically 0 for SSMs)
      head_dropout: 0.1      # MLP head dropout
      
      # Regression/classification head configuration
      head_hidden_dim: 512
      
      regression_fields:
        - eta
        - phi
        - pt
