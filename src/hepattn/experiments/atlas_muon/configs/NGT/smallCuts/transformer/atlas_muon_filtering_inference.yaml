seed_everything: 42
name: ATLAS-Muon-small

ckpt_path: /shared/ML/hepattn_muon/src/logs/ATLAS-Muon-small_20260202-T165646/ckpts/epoch=000-val_loss=1.33373.ckpt

data: 

  test_dir: /scratch/ml_test_data_156000_hdf5  
  val_dir: /scratch/ml_test_data_156000_hdf5
  train_dir: /scratch/ml_test_data_156000_hdf5
# this is the inference we were doing with Johnathan
  num_workers: 100
  num_train: -1 
  num_val: -1
  num_test: -1
  batch_size: 5000 # Start with batch_size=1 to avoid smart batching issues
  # use_smart_batching: false  # Disable smart batching as requested

  # ATLAS muon data parameters
  event_max_num_particles: 10  # Typically fewer tracks per event in muon data

  # Define which inputs will be available to the model
  inputs:
    hit:
    # Global hit coordinates
      - spacePoint_globEdgeHighX
      - spacePoint_globEdgeHighY
      - spacePoint_globEdgeHighZ
      - spacePoint_globEdgeLowX
      - spacePoint_globEdgeLowY
      - spacePoint_globEdgeLowZ
      - spacePoint_driftR
      # Add detector information
      - spacePoint_channel
      - spacePoint_layer
      - spacePoint_stationPhi
      - spacePoint_stationEta
      - spacePoint_stationIndex
      - spacePoint_technology
      # Add derived hit fields
      - r  # Radial distance
      - s  # 3D distance
      - theta  # Polar angle
      - phi  # Azimuthal angle
      - eta
    
  targets:
    hit:
      - on_valid_particle


trainer:
  # Training configuration
  max_epochs: 1
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: True

  # Specify loggers here
  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: atlas_muon_filtering

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 5
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: True
        write_preds: True
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 15 
        min_delta: 0.0
        mode: min
        verbose: True 

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:
                  # Global hit coordinates
                  - spacePoint_globEdgeHighX
                  - spacePoint_globEdgeHighY
                  - spacePoint_globEdgeHighZ
                  - spacePoint_globEdgeLowX
                  - spacePoint_globEdgeLowY
                  - spacePoint_globEdgeLowZ
                  - spacePoint_driftR
                  # Add detector information
                  - spacePoint_channel
                  - spacePoint_layer
                  - spacePoint_stationPhi
                  - spacePoint_stationEta
                  - spacePoint_stationIndex
                  - spacePoint_technology
                  # Add derived hit fields
                  - r  # Radial distance
                  - s  # 3D distance
                  - theta  # Polar angle
                  - phi  # Azimuthal angle
                  - eta
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 18  # Number of input features for ATLAS muon data
                    output_size: &dim 128
                    norm_input: true
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: hit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi
                    dim: *dim
                    sym_fields: [phi]
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8 # Slightly fewer layers for muon data
          dim: *dim
          attn_type: flash
          # If you don't wanna use the window you have to outcommetn to following two lines:
          # window_size: 512  # Smaller window size for fewer hits per event
          # window_wrap: true
          hybrid_norm: true
          # norm: RMSNorm
          attn_kwargs:
            num_heads: 8

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.01
                loss_fn: bce