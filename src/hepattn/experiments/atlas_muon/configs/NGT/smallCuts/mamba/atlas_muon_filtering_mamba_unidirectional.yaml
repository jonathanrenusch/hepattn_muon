seed_everything: 42
name: ATLAS-Muon-Mamba-Unidirectional
ckpt_path: /shared/tracking/hepattn_muon/src/logs/ATLAS-Muon-Mamba-Unidirectional_20251216-T204850/ckpts/epoch=006-val_loss=0.10869.ckpt
# Unidirectional Mamba SSM baseline for hit filtering
# Uses simple Mamba blocks processing hits sorted by phi angle

data: 
  train_dir: /scratch/ml_training_data_2694000_hdf5
  val_dir: /scratch/ml_validation_data_144000_hdf5

  num_workers: 8
  num_train: -1
  num_val: -1
  num_test: -1
  batch_size: 20

  # ATLAS muon data parameters
  event_max_num_particles: 10

  # Define which inputs will be available to the model
  inputs:
    hit:
      # Global hit coordinates
      - spacePoint_globEdgeHighX
      - spacePoint_globEdgeHighY
      - spacePoint_globEdgeHighZ
      - spacePoint_globEdgeLowX
      - spacePoint_globEdgeLowY
      - spacePoint_globEdgeLowZ
      - spacePoint_driftR
      # Add detector information
      - spacePoint_channel
      - spacePoint_layer
      - spacePoint_stationPhi
      - spacePoint_stationEta
      - spacePoint_stationIndex
      - spacePoint_technology
      # Add derived hit fields
      - r  # Radial distance
      - s  # 3D distance
      - theta  # Polar angle
      - phi  # Azimuthal angle
      - eta
  targets:
    hit:
      - on_valid_particle

trainer:
  # Training configuration
  max_epochs: 50
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [0,1]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: True

  # Specify loggers here
  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: atlas_muon_filtering_mamba

  callbacks:
    # Note: Compile callback removed as Mamba uses custom CUDA kernels
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 5
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: True
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 15 
        min_delta: 0.0
        mode: min
        verbose: True 

model:
  optimizer: Lion

  # SSMs converge more linearly, slightly higher learning rate can help
  lrs_config:
    initial: 2e-5
    max: 1e-4
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      # Sort hits by phi for proper sequence ordering in Mamba
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:
                 # Global hit coordinates
                  - spacePoint_globEdgeHighX
                  - spacePoint_globEdgeHighY
                  - spacePoint_globEdgeHighZ
                  - spacePoint_globEdgeLowX
                  - spacePoint_globEdgeLowY
                  - spacePoint_globEdgeLowZ
                  - spacePoint_driftR
                  # Add detector information
                  - spacePoint_channel
                  - spacePoint_layer
                  - spacePoint_stationPhi
                  - spacePoint_stationEta
                  - spacePoint_stationIndex
                  - spacePoint_technology
                  # Add derived hit fields
                  - r  # Radial distance
                  - s  # 3D distance
                  - theta  # Polar angle
                  - phi  # Azimuthal angle
                  - eta
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 18  # Number of input features (18 fields listed above)
                    output_size: &dim 128
                    norm_input: true
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: hit
                    dim: *dim
                    fields:
                      - r
                      - eta
                      - phi
                    dim: *dim
      encoder:
        # Unidirectional Mamba encoder - doubled depth for fair parameter comparison with bidirectional
        class_path: hepattn.models.MambaEncoder
        init_args:
          num_layers: 16  # Doubled from 8 to match ~2.1M params of bidirectional
          dim: *dim
          d_state: 64    # SSM state expansion factor (64 for Mamba-2)
          d_conv: 4      # Local convolution width
          expand: 2      # Block expansion factor
          use_mamba2: true  # Use Mamba-2 architecture (default)
          headdim: 32    # Head dimension (32 for dim=128, 64 for dim>=256)
          norm: RMSNorm 
          dropout: 0.0

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.01
                loss_fn: bce
