# =============================================================================
# Study 1 — Baseline Smooth-L1
# =============================================================================
# Direct regression with Smooth-L1 loss on linearly normalised targets.
# This is the simplest configuration — no spline transforms, no quantiles.
# Serves as the performance baseline for all other studies.
#
# Usage:  python train.py fit --config config/study1_baseline_smooth_l1.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Study1-Baseline-SmoothL1
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: smooth_l1
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              beta: 0.3
            z0:
              type: smooth_l1
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              beta: 0.3
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: smooth_l1
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              beta: 0.3
            qop:
              type: smooth_l1
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              beta: 0.3
