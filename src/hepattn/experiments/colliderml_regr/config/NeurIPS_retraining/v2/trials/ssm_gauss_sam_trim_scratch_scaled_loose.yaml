  # =============================================================================
# SSM (ssm_state) + Gaussian NLL + circular-phi + SAM + batch trimming — SCALED
# Same scaled architecture as ssm_gauss_sam_trim_scratch_scaled.yaml
# (dim 192, d_state 64, ~17M params) but trained on the loose-cuts p200
# finetune dataset for comparison against the KF double-matched version.
# 4xH100 DDP, batch 16k per GPU.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 50
  num_sanity_val_steps: 1
  gradient_clip_val: null
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Gauss-SAM-trim-scratch-scaled-loose
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  optimizer: AdamW
  use_sam: true
  sam_rho: 0.05
  sam_adaptive: false
  sam_start_epoch: 2
  trim_frac: 0.05
  trim_warmup_frac: 0.1
  gradient_clip_val: 1.0

  lrs_config:
    initial: 1.0e-05
    max: 5.0e-04
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 0.01
    betas: [0.9, 0.95]
    skip_scheduler: false
    schedule: cosine

  model:
    init_args:
      dim: 192
      state_head_output_dim: 192
      state_head_hidden_layers: [256]
      output_head_hidden_layers: [192]
      input_net_hidden_layers: [192]
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 192
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          qop_tail_weight: 1.5
          qop_scale: 2.0
          config:
            d0:
              type: gaussian
              weight: 0.5
              norm_min: -5.0
              norm_max: 5.0
            z0:
              type: gaussian
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
            phi:
              type: circular
              weight: 10.0
              beta: 0.01
            theta:
              type: gaussian_eta
              weight: 5.0
              norm_min: -3.1
              norm_max: 3.1
            qop:
              type: gaussian
              weight: 5.0
              norm_min: -5.5
              norm_max: 5.5

data:
  preprocessed_dir: /scratch/colliderml/p200_loose_finetune
  load_acts: true
  batch_size: 16000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
