# =============================================================================
# SSM (Bidirectional Mamba-2 state) + Q19 quantile loss — pretrain on p0
# =============================================================================
# Stage: pretrain (hard-scatter only, no pileup, batch 2048 on 1x H100).
# Architecture: 8-layer BidirectionalMambaEncoder with state extraction.
# Loss: 19-quantile pinball + eta-space theta + circular phi.
# =============================================================================

trainer:
  devices: 1
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q19-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          qop_tail_weight: 1.5
          qop_scale: 2.0
          config:
            d0:
              type: quantile
              weight: 0.5
              norm_min: -5.0
              norm_max: 5.0
              quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                          0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                          0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
            phi:
              type: circular
              weight: 10.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 5.0
              norm_min: -3.1
              norm_max: 3.1
              quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                          0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -5.5
              norm_max: 5.5
              quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                          0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 3.0e-04
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false
    schedule: cosine

data:
  preprocessed_dir: /scratch/colliderml/p0_loose_pretrain
  batch_size: 2048
  num_workers: 8
