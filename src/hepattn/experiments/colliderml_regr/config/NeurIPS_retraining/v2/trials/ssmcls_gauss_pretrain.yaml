# =============================================================================
# SSM-CLS (Mamba-2 + learned CLS tokens) + Gaussian/circular-phi — pretrain on p0
# =============================================================================
# SSM-CLS backbone (pool=ssm_cls) with the Gaussian NLL loss family.
# Total outputs: 10.
# =============================================================================

trainer:
  devices: 1
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-Gauss-FP32-Loose-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      pool: ssm_cls
      # See ssmcls_q19_pretrain.yaml for the rationale: widen to dim=192,
      # deepen to num_layers=10 so SSM-CLS lands at ~5.35 M params, matching
      # the SSM-state (~5.22 M) and Transformer (~5.49 M) budgets.
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          qop_tail_weight: 1.5
          qop_scale: 2.0
          config:
            d0:
              type: gaussian
              weight: 0.5
              norm_min: -5.0
              norm_max: 5.0
            z0:
              type: gaussian
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
            phi:
              type: circular
              weight: 10.0
              beta: 0.01
            theta:
              type: gaussian_eta
              weight: 5.0
              norm_min: -3.1
              norm_max: 3.1
            qop:
              type: gaussian
              weight: 5.0
              norm_min: -5.5
              norm_max: 5.5

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 3.0e-04
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false
    schedule: cosine

data:
  preprocessed_dir: /scratch/colliderml/p0_loose_pretrain
  batch_size: 2048
  num_workers: 8
