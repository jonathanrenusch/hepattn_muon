# =============================================================================
# ULTIMATE QUANTILE — pretrain on p0_core
# =============================================================================
# Synthesis of all NeurIPS-deadline improvements:
#   - d0:  SplineQuantile  (CDF-warped, 48x more output resolution in peaked core)
#   - phi: SplineQuantile on (phi_true − phi_innermost_hit).  The Δφ marginal
#          is bimodal (two peaks at ±0.02 rad from the magnetic-field bend
#          between IP and innermost measured hit) — the CDF spline adapts to
#          that structure and validates to <30 µrad bulk round-trip RMS
#          (target 500 µrad).  Spline support is ±0.2 rad, outliers beyond
#          that are clamped (same behaviour as the linear norm_min/max used
#          previously).
#   - theta: quantile_eta  (proven η-space parameterization kept)
#   - z0, qop: standard quantile with original norm ranges
#   - Geometric mean loss aggregation (no manual weight tuning, automatic
#     scale balancing, Chennupati et al. MultiNet++ 2019)
#   - All loss weights = 1.0 (geometric mean handles balancing)
#   - Batch size 512 (10-20% precision gain from smaller batches observed)
#   - Architecture: 8 layers, dim=128, d_state=32 (baseline size)
# =============================================================================

trainer:
  devices: [2]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-ULTIMATE-Q-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    class_path: hepattn.experiments.colliderml_regr.model.TrackParameterRegressor
    init_args:
      input_dim: 12
      dim: 128
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: spline_quantile
              weight: 1.0
              delta_anchor: innermost_phi
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_delta_phi.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  load_acts: true
  batch_size: 2048
  num_workers: 16
  prefetch_factor: 4
