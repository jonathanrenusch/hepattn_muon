# =============================================================================
# YOLO scaled pretrain — all 5 params with BinnedDFLQuantileOffsetLoss
# Scaled ssm_cls backbone: 30L × dim=192 × d_state=64 (≈16.5 M params)
# p0_core_pretrain full dataset, BS=2048, Lion + OneCycleLR, 50 epochs
#
# Scaling (per CLAUDE.md):
#   - Depth-first: num_layers 10 → 30 (3× baseline)
#   - d_state 32 → 64 (the "2× matches empirical +10% observation" hyperp)
#   - dim kept at 192 (no width scaling for ssm_cls)
#   - output_head_hidden_layers kept compact at [256]
#
# Loss design (per the YOLO-binned R&D plan):
#   - d0:  LINEAR bins + 2 overflow  (K=66)   — CDF-warp would amplify
#          the mode-collapse attractor, so we go linear on the only
#          parameter that exhibits it.  Offset head is the validated
#          7-quantile pinball, QFL-coupled to the softmax classification.
#   - z0:  CDF-warped bins (K=64)   via spline_z0.yaml
#   - phi: CDF-warped bins (K=64)   via spline_delta_phi.yaml with
#          delta_anchor: innermost_phi  (99.6 % within ±0.06 rad, so
#          DFL-on-delta is circular-safe by construction — no
#          wrap-aware loss needed; see the R&D plan for the reasoning).
#   - theta: CDF-warped bins (K=64) in η-space via spline_theta_eta.yaml
#   - qop: CDF-warped bins (K=64)   via spline_qop.yaml
#   - coupling: soft_qfl (Generalized Focal Loss §3)
#
# Note: expected pretrain wall-clock ≈ 3× the 10 L baseline.  CLAUDE.md
# records the baseline at ~60–100 h on 1× H100, so 30 L projects to
# ~180–300 h / ~8–13 d.  Plan accordingly; branch from an existing
# pretrained ckpt if deadline-critical.
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-YOLO-Scaled-Core-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    # Ramp the offset-head weight from 0 -> configured value over the first
    # 5% of training steps.  QFL-soft coupling is empirically stable with
    # lambda_offset=1.0 from step 0 on the smoke (5 epochs, no NaN), but
    # defensive on a 50-epoch pretrain where NaN-crash recovery is costly.
    - class_path: hepattn.experiments.colliderml_regr.callbacks.OffsetWarmupCallback
      init_args:
        warmup_fraction: 0.05
        start_factor: 0.0
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      # Force strict FP32 throughout the encoder (disables bf16 autocast).
      # The fast mamba-ssm CUDA kernel handles fp32 without a meaningful
      # slowdown on this machine (empirically verified) — gives us the
      # precision headroom the YOLO binned head was designed to exploit.
      encoder_autocast_dtype: float32
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 30
          dim: 192
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: binned_dfl_quantile
              weight: 1.0
              # Full-range uniform binning: 320 bins × 15.625 μm covers the
              # entire |d0| <= 2.5 mm physics-selected range at the same
              # resolution as the CKF-competitive core.  Replaces the earlier
              # "64 core + 2 overflow" scheme which coarsely lumped 4% of
              # tails into two junk-drawer bins and capped precision on
              # genuinely-displaced tracks.  Prompt bins are now 159/160
              # (centers ±7.8 μm — same physical positions as before).
              n_bins: 320
              binning: linear
              range_min: -2.5
              range_max: 2.5
              n_overflow: 0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
              # Per-track tail upweight w = max(1, |d0| / 30 μm), matching
              # ssmcls_mdn_d0_pretrain.yaml.  Counters the 95%/5%
              # core/tail gradient imbalance that drives Bayesian
              # soft-collapse under DFL.
              tail_weight_tau: 0.03
              # Per-bin class rebalancing (DIR/LDS, Yang et al. ICML 2021).
              # Loads empirical d0 hist from the full p0_core_pretrain
              # (71.4M tracks, 33.4% on peak bin 33) and weights each CE
              # contribution by 1/√hist clipped to [0.1, 10] for a 16×
              # dynamic range.  Stacks with tail_weight_tau: central
              # tracks get ~0.1× loss magnitude, high-|d0| tracks up to
              # ~17× from tail_tau × ~1× from class balance.
              class_balance_path: config/NeurIPS_retraining/v2/core_configs/splines/bin_hist_d0.pt
              class_balance_power: 0.5
              class_balance_clip: [0.1, 10.0]
            # Bin counts per param chosen so cls-only IQR/1.349 lands at
            # (or just below) the current SSM regression IQR — gives the
            # offset head a matched-scale job (YOLO/GFL literature: ~30-50%
            # improvement per head) rather than a 10-20× one.  See
            # scripts/bin_quantization_stats.py and scripts/plot_bin_residuals.py.
            z0:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 512                                # cls-only IQR ≈ 0.142 mm vs SSM 0.160 mm
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_z0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            phi:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 32                                 # cls-only IQR ≈ 0.60 mrad vs SSM 0.669 mrad
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_delta_phi.yaml
              delta_anchor: innermost_phi
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            theta:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 1024                               # cls-only IQR ≈ 0.96 mrad vs SSM 0.787 mrad
              binning: cdf_eta
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_theta_eta.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            qop:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 256                                # cls-only IQR ≈ 0.00226 vs SSM 0.00321
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_qop.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 3.0e-05       # 0.6× the 10 L baseline peak (5e-5).  Deeper stacks
                       # (3× depth here) want a lower peak LR to avoid
                       # early-training instability in the deeper residual
                       # path.  Empirically validated against the baseline
                       # ssmcls_q7 pretrain recipe.
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
