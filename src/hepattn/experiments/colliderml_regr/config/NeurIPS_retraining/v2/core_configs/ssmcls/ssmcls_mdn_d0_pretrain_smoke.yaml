# =============================================================================
# SSM-CLS + MDN(d0) — smoke / sanity check before the real pretrain
# =============================================================================
# Purpose
# -------
# Cheap (≈1 h on 1× H100) run to verify that the mixture-density d0 head is
# wired up correctly and actually learning, **before** committing to the full
# ~80 h pretrain.  What to watch in Comet:
#
#   1. train/total and val/total should trend down monotonically.
#   2. val/d0/mdn/map_frac_{0,1,2}: all three components should end up with
#      a non-trivial share of MAP mass (roughly > 5 % each).  If one
#      component gets 100 % you have collapsed back to a single-Gaussian
#      head and the MDN has failed to activate — investigate init_means /
#      sigma_init before launching the real run.
#   3. val/d0/mdn/mu_{0,1,2}: the μ's should *separate* (0 and ±0.2-0.3 mm
#      roughly) rather than all tracking toward 0.
#   4. val/d0/mdn/sigma_{0,1,2}: at least one σ should shrink noticeably
#      below its init (≈0.33 mm) — that's the prompt component finding
#      the core.
#   5. val/d0/mdn/effective_k: should sit in (1.5, 3.0).  → 1 means
#      collapse, ≈ K means fully balanced (probably under-specialised).
#
# If any of (2)–(5) looks broken, stop here and fix the head config
# rather than burning 80 h on a malformed run.
#
# What changed vs ssmcls_mdn_d0_pretrain.yaml
# -------------------------------------------
#   - trainer.max_epochs: 3     (was 50) — overfit-ish horizon
#   - trainer.limit_val_batches: 0.25 — make val 4× cheaper per epoch
#   - trainer.log_every_n_steps: 10 (was 50) — denser Comet curves
#   - EarlyStopping removed — meaningless over 3 epochs
#   - data.num_train_shards: 2 (was -1, i.e. all 900) — ~140 k tracks
#     per epoch, ~70 batches × 3 = ~210 training steps total
#
# Everything else (architecture, Lion + OneCycle, d0 MDN config, BS=2048)
# is identical to the real pretrain so the sanity-run results transfer.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 10
  limit_val_batches: 0.25
  log_every_n_steps: 10
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-MDN-D0-pretrain-SMOKE
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 10
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 10
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: mixture_density
              weight: 1.0
              n_components: 3
              norm_min: -2.5
              norm_max: 2.5
              init_means: [-0.1, 0.0, 0.1]
              sigma_init: -2.0
              sigma_floor: 1.0e-4
              tail_weight_tau: 0.03
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
  num_train_shards: 100
