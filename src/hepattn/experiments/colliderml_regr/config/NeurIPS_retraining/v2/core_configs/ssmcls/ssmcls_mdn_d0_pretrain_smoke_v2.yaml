# =============================================================================
# SSM-CLS + MDN(d0) — smoke v2 (beamspot-aware initialisation)
# =============================================================================
# Follow-up to ssmcls_mdn_d0_pretrain_smoke.yaml (run a431833f, 10 ep × 100 sh).
#
# Diagnostic from run a431833f at epoch 10 (20 k val tracks):
#
#   k   mean_pi   mean_mu [mm]   mean_sigma [mm]   MAP_freq
#   0   0.19      -0.007          0.110             10.1 %
#   1   0.79       0.000          0.012             89.4 %   ← matches the
#                                                              12.5 μm
#                                                              beamspot σ
#   2   0.016     -0.024          0.537              0.4 %   ← dead component
#
# Interpretation:
#   - k=1 (prompt) locked onto the simulation beamspot at σ ≈ 12.5 μm — the
#     IRREDUCIBLE physical floor set by Geant4 beamspot smearing. Prompt core
#     is already at the theoretical optimum and cannot be improved further.
#   - k=0 and k=2 both decayed their μ from ±0.25 mm → ≈0. The mode attractor
#     that drives the original single-head collapse is still operating on
#     individual component means. k=0 absorbed the tail population for both
#     sides (with μ ≈ 0), k=2 died.
#   - Net: collapse on displaced tracks stayed at 18.5 %, basically unchanged.
#
# What this config changes
# ------------------------
#   1. init_means: [-0.1, 0.0, 0.1] → [-0.4, 0.0, 0.4]
#      In normalised [-1, 1] space → physical [-1.0, 0, +1.0] mm.
#      Displaced components start far from the prompt attractor; their
#      gradient toward μ = 0 has to travel 4× as much ground, giving more
#      batches where they specialise before any drift takes over.
#   2. sigma_init: -2.0 → -3.0
#      softplus(-3) ≈ 0.049 in normalised space → physical init σ ≈ 0.12 mm
#      (was 0.33 mm).  Narrower components at init compete harder for
#      displaced tracks instead of one absorbing everything.
#   3. tail_weight_tau unchanged at 0.03 mm — already providing 6-30×
#      upweighting on moderate-displaced tracks. The issue was head design,
#      not weighting magnitude.
#
# Everything else identical to the v1 smoke run.
# Budget: ~1 h on 1× H100.  Compare component table vs v1 at matched cost.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 10
  limit_val_batches: 0.25
  log_every_n_steps: 10
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-MDN-D0-pretrain-SMOKE-v2
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 10
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 10
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: mixture_density
              weight: 1.0
              n_components: 3
              norm_min: -2.5
              norm_max: 2.5
              init_means: [-0.4, 0.0, 0.4]   # CHANGED (was [-0.1, 0, 0.1])
              sigma_init: -3.0               # CHANGED (was -2.0)
              sigma_floor: 1.0e-4
              tail_weight_tau: 0.03
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
  num_train_shards: 100
