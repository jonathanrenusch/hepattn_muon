# =============================================================================
# Run A — AdamW + WSD fine-tune on p200 (Tier-1 fix of ssm_q7_finetune.yaml)
# =============================================================================
# Rationale (see memory/reference_optimizer_schedule_research_2026_04.md):
#   - OneCycle with pct_start=0.10 and a 6× LR jump (5e-5 Lion → 3e-4 AdamW)
#     blew the pretrained basin on the original ssm_q7_finetune run.
#   - Switching to WSD (Hägele et al. 2024) keeps the LR flat after a short
#     warmup, letting the pretrained weights adapt to p200 without a
#     high-LR shock phase, then cools down at the end.
#   - Peak LR dropped 3e-4 → 1e-4 (2× pretrain peak, not 6×), per Gupta et al.
#     2023 — "peak LR dominates over warmup duration for forgetting control".
#   - Weight decay dropped 0.1 → 0.02 because the Lion-trained checkpoint
#     sits at a weight norm that AdamW's default WD would actively disturb.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-A-AdamW-WSD-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  optimizer: AdamW
  lrs_config:
    schedule: wsd          # Warmup-Stable-Decay (Hägele et al. 2024)
    initial: 1.0e-05       # LR at step 0 (start of warmup)
    max: 1.0e-04           # peak LR — 2× pretrain peak, not 6×
    end: 5.0e-06           # final LR after cosine cooldown
    pct_start: 0.02        # 2% warmup (vs. 10% in OneCycle)
    decay_pct: 0.15        # last 15% is cosine cooldown; the middle 83% is flat
    weight_decay: 0.02     # dropped from AdamW default; Lion pretrain WD = 1e-3
    betas: [0.9, 0.95]
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
