# =============================================================================
# Tiny d0-only classifier (pure classification, 16-core spline variant)
# =============================================================================
# Sibling to tiny_d0_4L_dim128_clsonly.yaml — IDENTICAL encoder + loss config
# except swaps the 24-core/2.6um CDF spline for a new 16-core/3.75um variant
# (spline_d0_piecewise_16core_3p75um.yaml, generated as a simple piecewise-
# linear CDF with 16 core bins in +/-30 um + 420 tail bins).
#
# Purpose: direct A/B on core-bin count.  24 core bins at 2.6um each sit
# well below the 12.5um beamspot smearing floor — possibly too fine to
# discriminate, which could contribute to the mode attractor / cross.
# 16 bins at 3.75um each are still well below the floor but give the
# classifier more information per bin and fewer close-neighbour bins to
# spread softmax mass across (reducing the "expectation lands at ~0"
# failure mode flagged earlier).
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 25
  precision: bf16-mixed
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-tinyD0-4L-dim128-cls-16core-fromscratch
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 25
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 25
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 25
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 128
      input_net_hidden_layers: [128]
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      output_head_hidden_layers: [128]
      output_head_init_scale: 0.01
      encoder_autocast_dtype: bfloat16
      separate_d0_head: false
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 4
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0]
          config:
            d0:
              type: binned_dfl_quantile
              n_bins: 436
              binning: cdf
              # 16 core bins + 420 tail bins (sibling of 24core_12um).
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_16core_3p75um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              coupling: none
              classification_only_predict: true
              weight: 1.0
              tail_weight_tau: 0.03
              offset_memory_efficient: true

  pretrained_ckpt_path: null

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 30000
  num_workers: 16
