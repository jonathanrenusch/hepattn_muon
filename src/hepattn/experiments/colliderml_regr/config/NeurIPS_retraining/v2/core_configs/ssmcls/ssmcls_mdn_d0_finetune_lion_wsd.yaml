# =============================================================================
# SSM-CLS + MDN(d0) — Lion + WSD fine-tune on p200_core
# =============================================================================
# Pair to ssmcls_mdn_d0_pretrain.yaml.  Backbone architecture and loss
# composition are reproduced exactly; the only pretrain→finetune changes
# are schedule shape, LR scale, and dataset.
#
# Why Lion + WSD (not AdamW + OneCycle):
#   - CLAUDE.md "Fine-tune is not closing the gap" — the AdamW + OneCycle
#     recipe blew the pretrained Lion basin in past runs.  Lion-continuation
#     with WSD at ~0.6× pretrain peak preserves the weight-norm regime
#     Lion built during pretrain (MuonAll, arXiv:2511.06086).
#   - The MDN head has to re-calibrate its π/μ/σ channels on the pileup
#     distribution, and that calibration is **easier** under a
#     continuous-optimizer continuation than under a family switch.
#     Optimizer discontinuity would reset Lion's internal momentum and
#     the freshly-trained mixture components would drift.
#
# Peak LR: 3e-5 (0.6× pretrain peak).  Same reasoning as
# ssm_q7_finetune_B_lion_wsd.yaml — BS jumps 2048 → 30k so Lion easily
# tolerates the larger batches; LR drop is belt-and-braces.
#
# The d0 MDN config MUST match pretrain verbatim (same n_components,
# init_means, sigma_init, sigma_floor, tail_weight_tau) or the
# pretrained checkpoint's d0 head cannot be loaded.
#
# pretrained_ckpt_path
# --------------------
# PLACEHOLDER.  Replace with the actual checkpoint path once the
# ssmcls_mdn_d0_pretrain run finishes.  A completed run typically writes
# logs/comet_offline/<run-hash>/ckpts/epoch=NN-val_total=0.XXXXX.ckpt.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-MDN-D0-Lion-WSD-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/PLACEHOLDER_ssmcls_mdn_d0_pretrain/ckpts/last.ckpt
  optimizer: Lion
  lrs_config:
    schedule: wsd
    initial: 3.0e-06       # warmup start (10% of peak)
    max: 3.0e-05           # 0.6× pretrain peak
    end: 1.0e-06           # post-cooldown floor
    pct_start: 0.02        # 2% warmup
    decay_pct: 0.15        # 15% cosine cooldown
    weight_decay: 1.0e-03  # matches pretrain Lion WD
    skip_scheduler: false
    # betas intentionally omitted → Lion default (0.9, 0.99)

  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: mixture_density
              weight: 1.0
              n_components: 3
              norm_min: -2.5
              norm_max: 2.5
              init_means: [-0.1, 0.0, 0.1]
              sigma_init: -2.0
              sigma_floor: 1.0e-4
              tail_weight_tau: 0.03
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
