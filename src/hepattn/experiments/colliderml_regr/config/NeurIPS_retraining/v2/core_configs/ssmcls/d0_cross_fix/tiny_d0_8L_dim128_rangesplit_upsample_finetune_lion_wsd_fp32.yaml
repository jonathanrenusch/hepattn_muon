# =============================================================================
# Fine-tune of tiny_d0_8L_dim128_rangesplit_upsample (run 67e16e63...) under
# the Lion + WSD + fp32-backbone recipe ported from run1 finetune_B.
# =============================================================================
# Architecture, data, and loss are byte-identical to the from-scratch parent
# (range-split d0 classifier with 24-bin inner / 420-bin outer + router, single
# encoder, 8 L / dim 128 SSM-CLS, tail upsampling 19x).  Only the fine-tuning
# scaffolding changes:
#   - pretrained_ckpt_path -> 67e16e63 ep 36 (best val/total)
#   - optimizer schedule: WSD (Hägele 2024) with halved LRs vs the parent's
#     OneCycleLR pretrain (max 5e-5 -> 2.5e-5; preserves Lion weight-norm basin)
#   - encoder_autocast_dtype: float32 to capture the fp32-inference free gain
#     identified for SSM backbones (no retraining needed for the flip)
#   - 4x H100 DDP via trainer.devices: -1, batch_size 30000 per rank
# =============================================================================

trainer:
  devices: -1
  max_epochs: 50
  precision: 32-true
  gradient_clip_val: 1.0
  reload_dataloaders_every_n_epochs: 1
  benchmark: true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-tinyD0-8L-dim128-rangesplit-upsample19-finetune-Lion-WSD-FP32
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 25
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 25
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 25
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/67e16e6319ed483a8c5c4be699c4698c/ckpts/epoch=036-val_total=3.42174.ckpt

  optimizer: Lion
  lrs_config:
    schedule: wsd
    initial: 2.5e-06       # 10% of peak
    max: 2.5e-05           # halved from parent OneCycle peak (5e-5); below pretrain Lion peak
    end: 5.0e-07
    pct_start: 0.02
    decay_pct: 0.5         # 50% cosine cooldown
    weight_decay: 1.0e-03  # matches parent Lion WD
    skip_scheduler: false
    # betas omitted -> Lion default (0.9, 0.99)

  model:
    init_args:
      pool: ssm_cls
      dim: 128
      input_net_hidden_layers: [128]
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      output_head_hidden_layers: [128]
      output_head_init_scale: 0.01
      encoder_autocast_dtype: float32
      separate_d0_head: false
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0]
          config:
            d0:
              type: range_split_classification
              k_inner: 24
              k_outer: 420
              inner_half_mm: 0.030
              outer_half_mm: 2.5
              split_mm: 0.030
              weight_router: 1.0
              weight_inner: 1.0
              weight_outer: 1.0
              weight: 1.0
              inner_route_threshold: 0.8

data:
  preprocessed_dir: /scratch/colliderml/p200_core_kf_matched_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  pin_memory: true
  streaming: true
  shard_buffer_size: 50
  tail_upsample_threshold_mm: 0.030
  tail_upsample_weight: 19.0
