# =============================================================================
# SSM Q7 SAFE — gentle p200 fine-tune, pretrain-like recipe
# =============================================================================
# Safety-net fine-tune: aligned with ssm_q7_pretrain.yaml (plain quantile on
# d0/z0/theta/qop, circular phi, weights 1/1/1/10/5, batch 2048, single GPU).
# Deltas vs pretrain:
#   - dataset:               p0_core_pretrain  →  p200_core_finetune
#   - pretrained_ckpt_path:  null              →  ac72e5c9 best ckpt
#   - optimizer:             Lion              →  AdamW (user preference for FT)
#   - weight_decay:          1e-3 (Lion)       →  1e-4 (AdamW equiv. regularization)
#   - max_epochs:            50                →  20
#   - add gradient_clip_val: 1.0  (same as aggressive finetune configs)
#   - add load_acts: true          (needed for DM metrics in val/test)
# Peak LR stays at the pretrain value 5e-5 on purpose — this is the "safe"
# variant; the aggressive finetunes use 3e-4.
#
# Use this when you need a fallback checkpoint you can trust: same optimizer,
# schedule and batch as the proven pretrain recipe, just exposed to the p200
# distribution.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 20
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-SAFE-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 20
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  optimizer: AdamW
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-04
    betas: [0.9, 0.95]
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  batch_size: 10000
  num_workers: 16
  streaming: true
  shard_buffer_size: 50
