# =============================================================================
# Run D — 10L SSMCLS, warm-restart, NO separate branch, DFL-d0 with heavily
#         damped weight.  Ablation against Run A to isolate whether scalar
#         rebalancing alone is sufficient.
# =============================================================================
# Paired with Run A: same encoder / optimizer / data / warm-start source.
# The only two differences:
#   - `separate_d0_head: false` — shared `pool_head` + `output_head`, DFL
#     gradient still touches the trunk via the shared projection.
#   - `d0.weight: 0.002` — chosen to bring d0 L2 trunk-gradient norm into
#     the same regime as the quantile heads (measured: DFL@weight=0.05
#     gave ‖g_d0‖≈7 on a 4 M trunk vs ~0.05-0.5 for the others, i.e. 20–40×
#     dominance — so /25× weight targets parity).
# Purpose: if Run D fails and Run A works, we have a clean mechanism
# claim for the paper that scalar rebalancing is insufficient because it
# cannot correct the direction-of-update (cos ≈ 0 but post-clip alignment
# is ~100% DFL).  If Run D also works, the story is weaker but both
# architectures are viable candidates.
# =============================================================================

trainer:
  devices: [3]
  max_epochs: 50
  precision: 32-true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-10L-sharedTrunk-DFLdamp-warm-FP32
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.per_head_grad_logger.PerHeadTrunkGradLogger
      init_args:
        probe_every_n_steps: 500
        include_pool_head: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      # The critical line: "float32" short-circuits torch.amp.autocast in
      # TrackParameterRegressor.forward (see model.py L413-419), so the
      # encoder and every op inside it stays in fp32 — A_log, dt_bias, D,
      # the selective-scan, and the post-SSM RMSNorm.
      encoder_autocast_dtype: float32
      # Ablation axis: shared trunk, no separate branch.
      separate_d0_head: false
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: binned_dfl_quantile
              n_bins: 436
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_24core_12um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              coupling: none
              # Damped weight — targets trunk-gradient-norm parity with the
              # quantile heads on this architecture/checkpoint.  If the
              # measured ratio comes back > ~5×, consider tightening to
              # 5.0e-4.
              weight: 1.0
              tail_weight_tau: 0.03
              offset_memory_efficient: true
            z0:
              type: quantile
              weight: 10.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 5.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ea2d9fba5fab4dd0bbc095e3246bba0d/ckpts/last.ckpt
  pretrained_ckpt_strict: false

  optimizer: Lion
  lrs_config:
    initial: 5.0e-06
    max: 2.5e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
