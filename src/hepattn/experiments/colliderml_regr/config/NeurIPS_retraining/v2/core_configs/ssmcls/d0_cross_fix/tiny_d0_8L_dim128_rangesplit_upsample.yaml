# =============================================================================
# Tiny d0 standalone — 3-head range-split classifier + TAIL UPSAMPLING
# =============================================================================
# Sibling of tiny_d0_4L_dim128_rangesplit.yaml.  Identical architecture
# (single encoder + 3 heads: 24-bin inner cls, 420-bin outer cls, binary
# router).  Two changes only:
#
#   1. Tail upsampling at DataLoader level — WeightedRandomSampler pulls
#      tracks with |truth d0|>30 um with weight 19 vs 1 for core, giving
#      batch-level 50/50 core/tail mix instead of the natural 95/5.
#   2. inner_route_threshold: 0.7 — at inference, commit to the inner head
#      only when softmax(router)[inner] > 0.7.  Uncertain tracks default
#      to the outer head (bounded ~30 um error at the edge bin) rather
#      than the inner head (unbounded crushed-to-0 error).
#
# Clean single-axis ablation vs 97f8a4a8 (the rangesplit run showing the
# residual cross): both changes together test the hypothesis that the
# cross comes from router bias under 95/5 class imbalance, not from the
# 3-head architecture itself.  If the cross lifts here, single encoder is
# enough and the twin-encoder variant is the more expensive backup.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 50
  precision: bf16-mixed
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-tinyD0-8L-dim128-rangesplit-upsample19-fromscratch
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 25
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 25
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 25
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 25
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 128
      input_net_hidden_layers: [128]
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      output_head_hidden_layers: [128]
      output_head_init_scale: 0.01
      encoder_autocast_dtype: bfloat16
      separate_d0_head: false
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0]
          config:
            d0:
              type: range_split_classification
              k_inner: 24
              k_outer: 420
              inner_half_mm: 0.030
              outer_half_mm: 2.5
              split_mm: 0.030
              weight_router: 1.0
              weight_inner: 1.0
              weight_outer: 1.0
              weight: 1.0
              # Inference-time asymmetric routing: commit to the inner head
              # only when softmax(router)[inner] > 0.7.  Below that, route
              # to the outer head so uncertain tracks get bounded ~30 um
              # error at the outer edge bin instead of unbounded crushed-
              # to-0 error at the inner centre bin.
              inner_route_threshold: 0.8

  pretrained_ckpt_path: null

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p200_core_kf_matched_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  pin_memory: true
  streaming: true
  shard_buffer_size: 50
  tail_upsample_threshold_mm: 0.030
  tail_upsample_weight: 19.0
