# =============================================================================
# KF-matched fine-tune — Muon+AdamW hybrid + WSD on p200_core_kf_matched
# =============================================================================
# Purpose
# -------
# Pretrain (p0_core_pretrain) is 79 % ACTS-DM; stock p200_core_finetune is only
# ~54 % DM (verified: 658k / 1.21M over 5 shards).  That ~25 pp gap means the
# fine-tune gradient is dominated by tracks the KF cannot match — yet the
# validation metrics that matter (`ssm_iqr_dm`, `ssm_rms_dm`) only score the
# DM subset.  Hypothesis: this distribution mismatch is part of why fine-tune
# fails to close the core-resolution gap on z0/θ/q/p.
#
# This config points the fine-tune at `p200_core_kf_matched_finetune`, where
# every track is ACTS-DM (require_acts_dm: True at preprocessing time).  The
# training distribution is now aligned with the metric, matching the ~79 % DM
# pretrain distribution in spirit.
#
# Optimizer recipe is identical to Run C (Muon+AdamW hybrid, WSD), since that
# is the current best-motivated recipe for the core-resolution push
# (SpecMuon arXiv:2602.16167 on PINN/DeepONet precision regression).
#
# Data location
# -------------
# Full dataset currently lives at
#   /eos/project/e/end-to-end-colliderml/data/NeurIPS_retraining/
#     p200_core_kf_matched_finetune
# For training speed, sync to /scratch first:
#   rsync -a /eos/.../NeurIPS_retraining/p200_core_kf_matched_finetune/ \
#            /scratch/colliderml/p200_core_kf_matched_finetune/
# The preprocessed_dir below assumes the /scratch copy exists.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-MuonHybrid-WSD-finetune-kfmatched
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  optimizer: MuonHybrid
  lrs_config:
    schedule: wsd
    initial: 1.0e-05
    max: 1.0e-04
    end: 5.0e-06
    weight_decay: 0.02
    betas: [0.9, 0.95]
    muon_max: 3.0e-04
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_ns_steps: 5
    pct_start: 0.02
    decay_pct: 0.15
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_kf_matched_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
