# =============================================================================
# SSM Q7 — precision-aware pretrain (p0_core)
# =============================================================================
# Baseline architecture (8L, dim=128, d_state=32) with the central-resolution
# fixes discussed for z0/theta/qop cores:
#   - chunk_size: 256 -> 8   (max track length is 20 hits, so with 256 the
#     whole track lives in one chunk and never hits the fp32 cross-chunk
#     reduction; at 8 each track sees ~3 fp32 re-syncs, which is where the
#     long-range-precision fix actually comes from under bf16 compute)
#   - batch_size: 2048 -> 4096  (H100 is at ~10% utilisation at 2048;
#     doubling BS lets Lion's sign update average over more samples, which
#     the scaling literature says it wants, without killing flatness since
#     we simultaneously drop LR)
#   - LR max: 5.0e-5 -> 3.0e-5  (Lion + higher BS wants lower peak LR;
#     empirically the 10% precision gain at BS=2048 came from flatter
#     minima, and we recover most of that by reducing LR instead of BS)
#   - pct_start: 0.10 -> 0.15  (deeper warmup for the larger effective step)
#   - weight_decay: 1.0e-3 -> 1.5e-3  (Lion wd scales inversely with LR
#     reduction to keep lr*wd regularisation strength roughly constant)
# Encoder still runs in bf16 autocast — the mamba2 CUDA kernel is best-tested
# there. The fp32-polish experiment lives in ssm_q7_fp32polish_finetune.yaml.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-PRECISION-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_state
      encoder_autocast_dtype: bfloat16
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  optimizer: Lion
  lrs_config:
    initial: 5.0e-06
    max: 3.0e-05
    end: 5.0e-07
    pct_start: 0.15
    weight_decay: 1.5e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 4096
  num_workers: 16
