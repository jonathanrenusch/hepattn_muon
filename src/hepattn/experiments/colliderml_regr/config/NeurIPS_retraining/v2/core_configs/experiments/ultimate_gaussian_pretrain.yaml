# =============================================================================
# ULTIMATE GAUSSIAN — pretrain on p0_core
# =============================================================================
# Gaussian NLL variant designed for maximum core resolution (IQR).
#
# Rationale: the Kalman Filter baseline is evaluated via iterative 3σ-clipped
# RMS, which approximates the IQR of the residual distribution.  Gaussian NLL
# optimises the mean with quadratic penalty, concentrating gradient signal on
# the peak — exactly what sharpens the core.  Quantile loss spreads effort
# evenly across tails, which hurts core sharpness.
#
# Key design choices:
#   - d0: SplineQuantile (Gaussian can't handle d0's kurtosis=84 distribution;
#     the CDF spline is necessary regardless of loss family)
#   - z0, qop: Gaussian NLL with softplus variance + β-NLL (β=0.5)
#   - phi: Gaussian NLL in delta mode (delta_anchor: innermost_phi)
#   - theta: GaussianEta (Gaussian NLL in η-space)
#   - β-NLL (Seitzer et al., ICLR 2022): weights each sample by σ^(2β)
#     (stop-gradient) to prevent variance inflation on hard examples
#   - output_head_init_scale: 0.01 — keeps initial outputs near zero,
#     critical for Gaussian NLL stability (prevents exp(-log_var) explosion)
#   - var_init: 2.0, var_eps: 1e-3 — wider initial Gaussian (delays variance
#     collapse) + floor on variance to prevent softplus dead zone (when
#     raw_var drifts to -10, var → 1e-6 → grad_mu blows up to 10^4 for qop).
#     σ_phys floor is 3-17x sharper than population std → no calibration loss.
#   - Geometric mean loss aggregation
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-ULTIMATE-G-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    class_path: hepattn.experiments.colliderml_regr.model.TrackParameterRegressor
    init_args:
      input_dim: 12
      dim: 128
      pool: ssm_state
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: gaussian
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              beta_nll: 0.5
            phi:
              type: gaussian
              weight: 1.0
              delta_anchor: innermost_phi
              norm_min: -0.2
              norm_max: 0.2
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              beta_nll: 0.5
            theta:
              type: gaussian_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              beta_nll: 0.5
            qop:
              type: gaussian
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              beta_nll: 0.5
  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  load_acts: true
  batch_size: 2048
  num_workers: 16
  prefetch_factor: 4
