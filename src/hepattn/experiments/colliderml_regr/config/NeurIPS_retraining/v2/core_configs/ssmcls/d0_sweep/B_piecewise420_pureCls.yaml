# =============================================================================
# d0 sweep B — pure classifier on PIECEWISE-12um bins (K=420)
# =============================================================================
# Purpose: isolate whether the shared within-bin offset head drives the
# residual cross. This requires bins with uniform physical resolution AND
# enough per-bin class mass to train; pure linear binning at 12 um would
# give ~420 bins with 10^4x class imbalance at the mode.
#
# Bin design (verified against p200_core_finetune, 12 M tracks):
#   - Core [-31.2, +31.2] um (95% of tracks): 8 bins of 8 um each.
#   - Tails [-2.5, -0.0312] and [+0.0312, +2.5] mm (5% of tracks):
#     206 bins of 12 um each side.
#   - Total K = 420 bins, max physical width 12.76 um (at the beamspot
#     floor EVERYWHERE — no clipping, no overflow, no piled-up edge bin).
#
# Prediction = spline.inverse(sum probs * u_centers). Spline is a custom
# monotonic PCHIP built so uniform-u bins recover the designed physical
# edges. Class imbalance (~1000x core/tail) is tamed by class_balance with
# power=0.5 + tail_weight_tau=0.03 per-track upweight.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 10
  limit_val_batches: 0.25
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-D0-SWEEP-B-8L-ds16
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 8
          dim: 192
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: binned_dfl_quantile
              n_bins: 420
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_12um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              coupling: none
              weight: 0.05
              tail_weight_tau: 0.03
              offset_memory_efficient: true
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
  num_train_shards: 100
