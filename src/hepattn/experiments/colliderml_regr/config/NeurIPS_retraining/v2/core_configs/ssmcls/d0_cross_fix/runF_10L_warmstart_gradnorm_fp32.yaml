# =============================================================================
# Run F — 10L SSMCLS, warm-restart from ea2d9fba (ep48), separate d0 branch +
#         DFL-d0 + GradNorm-lite on the d0 branch's shared-trunk gradient,
#         FP32 backbone, full encoder trainable.
# =============================================================================
# Premise (CLAUDE.md Open Issue #3): on the warm-restart runA the DFL
# gradient that flows back through `d0_pool_head` into the shared encoder's
# `pooled` output is ~24-150x the magnitude of the continuous regression
# heads' trunk gradients.  This empirically destroys z0/phi/theta/qop at
# both 8M and 15M trunk sizes (see CLAUDE.md gradient-cosine + trunk-norm
# tables).  Run F dampens that gradient on the encoder side by a fixed
# scalar `d0_grad_scale=0.01` (one-shot matched magnitude, no EMA
# bookkeeping); forward is untouched so the d0 branch still sees the full
# encoder output at inference.  If z0/phi/theta/qop converge normally AND
# the d0 cross lifts under live DFL, the shared-trunk-with-rescale
# architecture is viable.  If d0 still collapses, we've shown that even
# with gradient access the shared features can't be reshaped for tail
# discrimination — and capacity needs to be dedicated (runH/I tiny d0
# standalone).
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 50
  precision: 32-true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-10L-sepD0DFL-gradnorm001-warm-FP32
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    # Keep the per-head trunk-grad probe — watching whether the rescale
    # actually matches d0's magnitude to the other four is the key diagnostic.
    - class_path: hepattn.experiments.colliderml_regr.per_head_grad_logger.PerHeadTrunkGradLogger
      init_args:
        probe_every_n_steps: 500
        include_pool_head: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.0005
      encoder_autocast_dtype: float32
      separate_d0_head: true
      # GradNorm-lite: scale d0's contribution to the shared-encoder gradient
      # by 1/100.  Matches the ~100x magnitude gap observed in the
      # d2357297 (15M trunk) run; picked as a conservative starting point.
      # Direction of the d0 gradient is preserved (the +0.73 d0<->qop
      # alignment observed at 15M), only magnitude is capped.  The d0
      # branch's own params (d0_pool_head, d0_output_head) receive the full
      # gradient — it's only the backprop into the shared encoder that is
      # dampened.
      d0_grad_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: binned_dfl_quantile
              n_bins: 436
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_24core_12um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              coupling: none
              classification_only_predict: true
              weight: 1.0
              tail_weight_tau: 0.03
              offset_memory_efficient: true
            z0:
              type: quantile
              weight: 10.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 5.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ea2d9fba5fab4dd0bbc095e3246bba0d/ckpts/last.ckpt
  pretrained_ckpt_strict: false

  optimizer: Lion
  lrs_config:
    initial: 5.0e-06
    max: 2.5e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 15000
  num_workers: 16
