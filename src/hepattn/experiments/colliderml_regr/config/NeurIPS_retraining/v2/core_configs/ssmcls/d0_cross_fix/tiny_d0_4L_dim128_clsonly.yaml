# =============================================================================
# Tiny d0-only classifier (pure classification, no offset)
# =============================================================================
# Dedicated ~1M-param model that trains ONLY on d0 (single head).  Same
# Fourier input encoding as the big regressor (inherited from base.yaml)
# so merging with a separately-trained 5-head model at inference time is
# straightforward — identical hit-feature normalisation and embedding.
# Rationale (2026-04-23, CLAUDE.md Open Issue #3): the DFL d0 gradient is
# ~100x the magnitude of the continuous regression heads', and scaling the
# shared trunk from 4M→15M made the ratio worse (24x→150x).  A dedicated
# small d0-only encoder pays the full DFL gradient budget into ~0.7M
# parameters that only exist for this task — no conflict to resolve.
#
# Architecture: ssm_cls pool, 4L Mamba-2, dim=128, d_state=16.
# Loss: binned_dfl_quantile with coupling=none (no offset training) +
#       classification_only_predict=true (pure cls at inference).
# Binning: 436 bins via spline_d0_piecewise_24core_12um (the same spline
#          the big runs use — user asked for "16 in center" but we need a
#          new spline file to get exactly that; 24/12um is the closest
#          existing variant.  TODO: regenerate spline with 16 core bins if
#          wanted.)
# =============================================================================

trainer:
  devices: [2]
  max_epochs: 25
  precision: bf16-mixed
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-tinyD0-4L-dim128-cls-fromscratch
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 25
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 25
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 25
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 25
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 128
      input_net_hidden_layers: [128]
      # Thin pool_head to not blow the parameter budget; single head means
      # no separate_d0_head needed — d0 IS the head.
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      output_head_hidden_layers: [128]
      output_head_init_scale: 0.01
      encoder_autocast_dtype: bfloat16
      separate_d0_head: false
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 4
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          # Single-param training.  RegressionPredictionWriter was patched
          # to skip missing params so this works cleanly.
          parameter_order: [d0]
          config:
            d0:
              type: binned_dfl_quantile
              n_bins: 436
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_24core_12um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              coupling: none
              classification_only_predict: true
              weight: 1.0
              tail_weight_tau: 0.03
              offset_memory_efficient: true

  # From-scratch — no warm-restart.  This is a structurally different model.
  pretrained_ckpt_path: null

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 30000  # ramped from 4096 — tail tracks scale linearly with batch
  num_workers: 16
