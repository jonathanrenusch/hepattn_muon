# =============================================================================
# YOLO scaled fine-tune — all 5 params BinnedDFLQuantileOffsetLoss
# Scaled ssm_cls backbone: 30L × dim=192 × d_state=64 (≈16.5 M params)
# p200_core_finetune, Lion + WSD (Run B default), 4× H100 DDP, 100 epochs
#
# Fine-tune optimiser/schedule (per the R&D plan §"Optimizer / batch size"):
#   Follows whichever of the running A/B/C sweep wins.  Until the verdict
#   is in, this config defaults to the cheapest continuity option:
#   **Run B recipe — Lion continuation + WSD at 0.6× pretrain peak**
#   (matches ssm_q7_finetune_B_lion_wsd.yaml).  If A (AdamW) or C (Muon)
#   is declared the winner, copy this config to a sibling file with the
#   winning optimizer block substituted rather than editing in place.
#
# IMPORTANT — update ``pretrained_ckpt_path`` to the run-id of the
# yolo_all5_scaled_pretrain.yaml pretrain once it completes.
# =============================================================================

trainer:
  devices: -1           # 4× H100 DDP
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-YOLO-Scaled-Core-Finetune-B-Lion-WSD
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    # NOTE: OffsetWarmupCallback is intentionally omitted on finetune.
    # Its purpose is to protect the offset head from a near-uniform cls
    # softmax at step 0 (pretrain-from-scratch regime).  A pretrained
    # checkpoint already has a calibrated cls + offset head, so zeroing
    # lambda_offset would *starve* the already-trained offset head of
    # supervision rather than protect it.
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  # PLACEHOLDER — update to the actual pretrain checkpoint once
  # yolo_all5_scaled_pretrain.yaml completes.
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/PLACEHOLDER_YOLO_PRETRAIN_RUN/ckpts/last.ckpt
  optimizer: Lion
  lrs_config:
    # Lion continuation + WSD, scaled to global BS = 7500 × 4 = 30 000.
    # Reference: Run B at baseline BS=2048 used max = 3e-5 (= 0.6× baseline
    # pretrain peak of 5e-5).  √k scale to 30 k: 3e-5 × √(30000/2048) =
    # 3e-5 × 3.83 ≈ 1.15e-4.  Equivalent to 0.6× the newly-scaled yolo
    # pretrain peak (1.9e-4), so the Run-B continuity ratio is preserved.
    schedule: wsd
    initial: 1.15e-05      # 10% of peak (Lion continuation: short warmup)
    max: 1.15e-04
    end: 3.8e-06
    pct_start: 0.02
    decay_pct: 0.15
    weight_decay: 1.0e-03  # matches pretrain Lion WD
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      # Force strict FP32 throughout the encoder (disables bf16 autocast).
      # The fast mamba-ssm CUDA kernel handles fp32 without a meaningful
      # slowdown on this machine (empirically verified) — gives us the
      # precision headroom the YOLO binned head was designed to exploit.
      encoder_autocast_dtype: float32
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 30
          dim: 192
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: binned_dfl_quantile
              weight: 1.0
              # Must match yolo_all5_scaled_pretrain.yaml exactly — see
              # the pretrain config for the reasoning on full-range uniform
              # binning (320 × 15.625 μm) over ±2.5 mm with no overflow.
              n_bins: 320
              binning: linear
              range_min: -2.5
              range_max: 2.5
              n_overflow: 0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
              # Per-track tail upweight w = max(1, |d0| / 30 μm), matching
              # ssmcls_mdn_d0_pretrain.yaml.  Counters the 95%/5%
              # core/tail gradient imbalance that drives Bayesian
              # soft-collapse under DFL.
              tail_weight_tau: 0.03
              # Per-bin class rebalancing (DIR/LDS, Yang et al. ICML 2021).
              # Loaded from the p0_core_pretrain histogram — the p200
              # distribution is substantially similar on d0 (same physics
              # selection), so reusing the p0-fit buffer is fine for
              # finetune.  If a finetune-specific buffer is wanted, run
              # compute_bin_histograms.py against p200_core_finetune.
              class_balance_path: config/NeurIPS_retraining/v2/core_configs/splines/bin_hist_d0.pt
              class_balance_power: 0.5
              class_balance_clip: [0.1, 10.0]
            # Bin counts must match yolo_all5_scaled_pretrain.yaml exactly
            # so the pretrained checkpoint loads cleanly (n_outputs of the
            # output_head must be identical across pretrain→finetune).
            z0:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 512
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_z0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            phi:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 32
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_delta_phi.yaml
              delta_anchor: innermost_phi
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            theta:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 1024
              binning: cdf_eta
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_theta_eta.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl
            qop:
              type: binned_dfl_quantile
              weight: 1.0
              n_bins: 256
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_qop.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              lambda_offset: 1.0
              coupling: soft_qfl

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  # 7500 is the per-rank memory ceiling on H100 for this 30 L backbone;
  # Lightning treats batch_size as per-rank, so with devices: -1 across
  # 4× H100 DDP this gives global BS = 7500 × 4 = 30 000.
  batch_size: 7500
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
