# =============================================================================
# SSM + Gaussian NLL (+ circular phi) — pretrain on p0_core
# =============================================================================
# Gaussian-loss study using softplus variance parameterisation.
#
# Key changes vs the original (broken) config:
#   - variance_param: softplus on all gaussian losses — eliminates the
#     exp(-log_var) gradient amplification feedback loop that caused 19 OOM
#     gradient explosion.  Softplus gradient is sigmoid(x) ∈ (0,1), always
#     bounded, no clamping needed, no dead zones.  With softplus the
#     gradient norm is ~1.7x the quantile baseline — no output_head_init_scale
#     needed (0.01 was required for the old exp path but starves phi of signal).
#   - var_init: 2.0 — model starts with wide Gaussians (low confidence),
#     giving mu time to converge before variance tightens.
#   - var_eps: 1e-3 — floors variance at 0.001 in normalised space.  Caps
#     gradient amplification at 1000x (vs 10^6 with 1e-6 floor).  σ_phys
#     floor is 8x-17x sharper than population std for all params — no loss
#     of calibration.  Fixes qop convergence (was producing 10^4 gradients
#     due to softplus dead zone when raw_var drifts to -10 range).
#   - phi beta: 1.0 (was 0.01) — quadratic near origin gives gradient
#     proportional to error instead of just sign(error).
#   - Removed GradientSpikeSkip (band-aid, no longer needed).
#   - Removed qop_tail_weight (compounding amplification on hard samples).
#   - Encoder dropout 0.0 — matches the working quantile config exactly.
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Gauss-FP32-Core-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: gaussian
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
            z0:
              type: gaussian
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
            phi:
              type: circular
              weight: 1.0
              beta: 1.0   # 0.01 → 1.0: with output_head_init_scale=0.01
                           # all predictions start ≈ 0, so beta=0.01 makes the
                           # gradient sign-only (±1) which cancels across the
                           # batch for uniform phi.  beta=1.0 gives quadratic
                           # loss near origin → gradient proportional to error.
            theta:
              type: gaussian_eta
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
            qop:
              type: gaussian
              variance_param: softplus
              var_init: 2.0
              var_eps: 1.0e-03
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
