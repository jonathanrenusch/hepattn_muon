# =============================================================================
# Run E — SAFETY NET — 10L SSMCLS, warm-restart from ea2d9fba BEST ckpt
#         (epoch 48 / val_total 0.00685), encoder + shared heads FROZEN,
#         only the separate d0 branch trains. FP32 backbone.
# =============================================================================
# Design principles we're enforcing:
#   (i)  never regress z0/phi/theta/qop — this is the "safety net" run; by
#        construction their outputs are byte-identical to the ea2d9fba best
#        checkpoint because the encoder + input_net + pool_head +
#        output_head all have requires_grad=False throughout.
#   (ii) add a DFL-based d0 head on top of that frozen encoder to address
#        the d0 collapse artifact (CLAUDE.md issue #3, 19.7% collapse rate
#        on |truth d0| >= 0.05 mm).
#   (iii) accept potential d0 RMS degradation as a fair trade for (i)+(ii).
# The shared `output_head` still emits z0/phi/theta/qop outputs; the loss
# module still computes all five losses (useful for monitoring); but only
# the d0 branch's grad reaches any trainable parameter.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 50
  precision: 32-true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-10L-d0onlyFrozen-warm-FP32
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    # Freezing callback — everything except d0_pool_head + d0_output_head
    # is frozen for the entire run.  No unfreeze_epoch.
    - class_path: hepattn.experiments.colliderml_regr.callbacks.D0BranchOnlyFreeze
    # Per-head trunk-gradient probe is not very informative here (only d0
    # grad propagates to trainable params), but we keep it enabled for
    # the module-level grad_probe/d0/trunk_norm sanity read.
    - class_path: hepattn.experiments.colliderml_regr.per_head_grad_logger.PerHeadTrunkGradLogger
      init_args:
        probe_every_n_steps: 500
        include_pool_head: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      # The critical line: "float32" short-circuits torch.amp.autocast in
      # TrackParameterRegressor.forward (see model.py L413-419), so the
      # encoder and every op inside it stays in fp32 — A_log, dt_bias, D,
      # the selective-scan, and the post-SSM RMSNorm.
      encoder_autocast_dtype: float32
      # Separate d0 projection + output head off the shared encoder.  The
      # shared pool_head is frozen by D0BranchOnlyFreeze so it would not
      # matter here — but we still need the separate d0 branch because
      # the shared output_head produced by warm-restart only has slots
      # for z0/phi/theta/qop (the d0 slice was dropped by
      # pretrained_ckpt_strict=false; `separate_d0_head=true` is what
      # adds the new d0-only output Dense).
      separate_d0_head: true
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            # d0 head — same settings as Run A (user's updated values).
            d0:
              type: binned_dfl_quantile
              n_bins: 436
              binning: cdf
              spline_config: config/NeurIPS_retraining/v2/core_configs/splines/spline_d0_piecewise_24core_12um.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
              # coupling: none → pinball-offset gradient is zeroed in training
              # (losses.py:1347-1348), so the K+Q output head trains only the
              # K=436 classification logits; the Q=7 offset rows receive no
              # gradient and remain at initialisation.
              coupling: none
              # classification_only_predict: true → predict() returns pure
              # softmax-weighted bin-CDF expectation only, ignoring the
              # untrained offset rows (losses.py:1388-1392).  Without this,
              # the default predict path still adds median_offset/K from the
              # random-init offset slots and contaminates the d0 point
              # estimate in test_predictions.h5 with uncontrolled noise.
              classification_only_predict: true
              weight: 1.0
              tail_weight_tau: 0.03
              offset_memory_efficient: true
            # The other four losses are kept in the config for validation-
            # metric reporting only; their gradients cannot flow to any
            # trainable parameter (all upstream modules are frozen) so
            # they effectively act as monitors.
            z0:
              type: quantile
              weight: 10.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 5.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  # Warm restart from the BEST (not last) ea2d9fba checkpoint — this is
  # the all-quantile reference that produced the headline numbers in
  # CLAUDE.md (d0 iter-3σ RMS 0.0123 mm, z0 0.207, phi 0.700 mrad,
  # theta 0.878 mrad, qop 0.00344).  Those numbers are now locked in for
  # the frozen portion of this network.
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ea2d9fba5fab4dd0bbc095e3246bba0d/ckpts/epoch=048-val_total=0.00685.ckpt
  pretrained_ckpt_strict: false

  optimizer: Lion
  lrs_config:
    # Only the freshly-initialised d0 branch trains — use a normal
    # pretrain-scale LR, not a warm-restart damping.  The branch starts
    # at near-zero (output_head_init_scale=0.01) and needs to learn from
    # scratch, so the reduced-peak Lion-continuation schedule that Runs
    # A/D use would unnecessarily slow it down.
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 30000
  num_workers: 16
