# =============================================================================
# Run C — Muon+AdamW hybrid + WSD fine-tune on p200 (experimental)
# =============================================================================
# Rationale (see memory/reference_optimizer_schedule_research_2026_04.md):
#   - SpecMuon (arXiv:2602.16167, 2026) tested Muon variants specifically on
#     PINN/DeepONet precision regression and reported 2–10× lower final MSE
#     vs AdamW on Burgers PINN — the closest literature analog to our sub-
#     mrad / 1e-3 curvature target.
#   - Muon runs on 2-D matrix weights only (interior SSM in_proj/out_proj,
#     Dense mid-layers).  AdamW handles everything else: RMSNorm (1-D),
#     biases (1-D), SSM scalars A_log/D (1-D), plus input_net / pool_head /
#     output_head (excluded by convention per Keller Jordan 2024).
#   - The hybrid is implemented as a single composite optimizer
#     :class:`hepattn.experiments.colliderml_regr.muon.MuonHybrid`, so
#     automatic optimization + a single LR scheduler still work.
# Caveats:
#   - Checkpoint was trained with Lion — weight-norm regime will mismatch.
#     Expect a rougher first epoch than Run B.
#   - Newton-Schulz iteration runs in the parameter's native dtype (fp32
#     for this model) to preserve gradient precision for the precision-
#     sensitive phi/theta/qop/z0 heads.  On A100 this still uses TF32
#     tensor cores so the speed penalty vs bfloat16 is small.  The weights,
#     forward pass, loss, and gradients all stay fp32 regardless.
#   - ``muon_max`` is 3× the AdamW peak, matching the "Muon LR ~3–10× AdamW
#     LR" guidance from the Muon blog post.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-C-MuonHybrid-WSD-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  optimizer: MuonHybrid
  lrs_config:
    schedule: wsd
    # AdamW group (1-D params, input/pool/output heads) — standard scale.
    initial: 1.0e-05       # start of warmup for AdamW group
    max: 1.0e-04           # peak LR for AdamW group
    end: 5.0e-06           # final LR (both groups cool to this absolute eta_min)
    weight_decay: 0.02     # AdamW WD, dropped for Lion-pretrain compatibility
    betas: [0.9, 0.95]
    # Muon group (2-D interior weights) — peak LR ~3× AdamW per Muon blog.
    muon_max: 3.0e-04      # peak LR for Muon group
    muon_weight_decay: 0.0 # Muon's orthogonalized update doesn't need WD
    muon_momentum: 0.95
    muon_ns_steps: 5
    # Schedule shape
    pct_start: 0.02        # 2% warmup applies to both groups proportionally
    decay_pct: 0.15        # 15% cosine cooldown
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
