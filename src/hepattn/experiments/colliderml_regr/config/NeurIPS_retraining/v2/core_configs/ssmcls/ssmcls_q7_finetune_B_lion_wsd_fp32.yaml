# =============================================================================
# Run B (ssmcls) — Lion-continuation + WSD fine-tune on p200_core, fp32 encoder.
# =============================================================================
# Pair to ssmcls_q7_finetune_muon_wsd_fp32.yaml (Run C) and
# ssmcls_q7_finetune_A_adamw_wsd_fp32.yaml (Run A): same architecture,
# checkpoint, schedule shape, dataset, batch size, epoch budget — only the
# optimizer family / LR / WD differs.
# Mirrors ssm/ssm_q7_finetune_B_lion_wsd.yaml on the CLS backbone.
# Tests whether keeping the optimizer family fixed (Lion pretrain → Lion
# fine-tune) preserves the weight-norm regime better than switching to
# AdamW or to Muon hybrid.
# =============================================================================

trainer:
  devices: [2, 3]
  max_epochs: 50
  precision: 32-true
  gradient_clip_val: 1.0
  reload_dataloaders_every_n_epochs: 1
  benchmark: true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-Q7-B-Lion-WSD-FP32-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ea2d9fba5fab4dd0bbc095e3246bba0d/ckpts/epoch=048-val_total=0.00685.ckpt
  optimizer: Lion
  lrs_config:
    schedule: wsd
    initial: 1.5e-06       # 10% of peak (halved from 3e-6)
    max: 1.5e-05           # halved from 3e-5 — plateau-stuck val/total in earlier
                           # run cliff-dropped only in cooldown; this also moves
                           # below pretrain Lion peak (5e-5), appropriate for
                           # continuing in-basin under 4× DDP
    end: 5.0e-07           # halved from 1e-6
    pct_start: 0.02        # 2% warmup
    decay_pct: 0.5         # 50% cosine cooldown — give the productive decay
                           # phase real budget instead of an 8-epoch tail
    weight_decay: 1.0e-03  # matches pretrain Lion WD
    skip_scheduler: false
    # betas omitted → Lion default (0.9, 0.99)

  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder_autocast_dtype: float32
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.1
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 0.1
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 1.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_kf_matched_finetune
  load_acts: true
  batch_size: 20000
  num_workers: 1
  pin_memory: true
  streaming: true
  shard_buffer_size: 50
