# =============================================================================
# d0 sweep E — 2-component Mixture Density head (core + displaced)
# =============================================================================
# User proposal: two mechanisms, one for the |d0| < 30 um prompt regime,
# one for the displaced-track tails, with a classifier gate choosing.
# This is exactly a mixture-density head with K=2: the mixture weights pi_k
# are the soft gate (no hard threshold — CLAUDE.md warned against
# zero-inflated classifiers with discontinuities).
#
# init_means are in NORMALIZED space ([-1, 1] mapped from [-2.5, 2.5] mm).
#  - norm 0.004 = 0.01 mm physical
# Both components init near the beamspot; training will drive one to
# shrink (prompt core, sigma ~ 0.02/2.5 = 8 um physical) and the other to
# widen (displaced tail, sigma ~ 0.3/2.5 = 0.75 mm). sigma_init = -2 ->
# softplus(-2) ~ 0.13 normalized = 0.33 mm physical, which is roughly the
# midpoint between the two regimes; training will pull each component to
# its natural scale.
#
# Validation diagnostics to watch (auto-logged by MDN loss):
#   val/d0/mdn/map_frac_{0,1}  — both should end > 5%
#   val/d0/mdn/sigma_{0,1}     — should separate by ~10x
#   val/d0/mdn/mu_{0,1}        — can both stay near 0 (the sigma split
#                                 is what distinguishes them, not the mean)
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 10
  limit_val_batches: 0.25
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSMCLS-D0-SWEEP-E-8L-ds16
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  model:
    init_args:
      pool: ssm_cls
      dim: 192
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 8
          dim: 192
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: mixture_density
              n_components: 2
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              init_means: [-0.004, 0.004]
              sigma_init: -2.0
              sigma_floor: 1.0e-4
              tail_weight_tau: 0.03
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_core_pretrain
  batch_size: 2048
  num_workers: 16
  num_train_shards: 10
