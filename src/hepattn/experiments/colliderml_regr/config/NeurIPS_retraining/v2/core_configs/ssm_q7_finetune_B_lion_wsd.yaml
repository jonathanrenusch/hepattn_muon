# =============================================================================
# Run B — Lion + WSD fine-tune on p200 (same-optimizer continuation)
# =============================================================================
# Rationale (see memory/reference_optimizer_schedule_research_2026_04.md):
#   - MuonAll paper (arXiv:2511.06086) and Lion literature both report that
#     switching optimizer family at fine-tune hurts — the pretrained checkpoint
#     sits at a weight-norm regime shaped by the Lion pretrain update +
#     weight-decay interplay.  Continuing with Lion respects that regime.
#   - Peak LR 3e-5 = 0.6× pretrain peak (5e-5).  Rationale: BS jump 2048 →
#     30000 is 14.6×; Lion tolerates large batches well but we still drop LR
#     slightly vs pretrain to avoid destroying the basin.
#   - WSD replaces OneCycle: short warmup, long flat plateau, short cooldown.
#   - Lion WD kept at 1e-3 to match pretrain.
# =============================================================================

trainer:
  devices: -1
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-B-Lion-WSD-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  optimizer: Lion
  lrs_config:
    schedule: wsd
    initial: 3.0e-06       # start of warmup (10% of peak)
    max: 3.0e-05           # 0.6× pretrain peak; BS 30k is well past Lion's critical batch
    end: 1.0e-06           # final LR after cosine cooldown
    pct_start: 0.02        # 2% warmup
    decay_pct: 0.15        # 15% cooldown
    weight_decay: 1.0e-03  # matches pretrain Lion WD
    skip_scheduler: false
    # betas intentionally omitted → Lion default (0.9, 0.99)

  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
