# =============================================================================
# SSM Q7 — FP32 polish fine-tune from the baseline bf16 pretrain
# =============================================================================
# Purpose: directly test the "bf16 recurrence is limiting central resolution
# for z0/theta/qop" hypothesis.  Takes the proven ssm_q7 pretrain checkpoint
# (ac72e5c9ede74f6eb241412b8652c4d1, epoch=049, val_total=0.00717) and runs
# a short fine-tune on p200 with the encoder autocast DISABLED — every op in
# the Mamba backbone runs in fp32, including A_log / dt_bias / D and the
# post-SSM RMSNorm.
#
# Short (15 ep) + low LR so we only "polish" the bf16 solution rather than
# re-train.  If the z0 / theta / qop central cores sharpen after this, the
# bf16 precision ceiling is confirmed and the precision pair above (chunk=8
# + tuned BS/LR) is the right direction.  If they do NOT sharpen, the core
# shape is a quantile-loss flat-top artefact and not a precision issue — in
# that case keep the bf16 kernel and focus elsewhere.
#
# NOTE: mamba-ssm's fast CUDA chunk kernel may fall back to the reference
# path when inputs are fp32 — expect a ~3-5x slowdown per step.  That's fine
# for 15 epochs on p200_core.  If the kernel errors out entirely, lower
# chunk_size further (to 4) and/or confirm the installed mamba-ssm version
# exposes a pure-fp32 path.
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 15
  # Keep strict fp32 at the Lightning level AND disable the encoder autocast
  # below, so nothing in the forward path downcasts.
  precision: 32-true
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-FP32POLISH-finetune
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 8
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ac72e5c9ede74f6eb241412b8652c4d1/ckpts/epoch=049-val_total=0.00717.ckpt
  # MuonHybrid + WSD: ported from Run C (ssm_q7_finetune_C_muon_wsd.yaml),
  # which showed the smoothest early-step behaviour of the A/B/C sweep.
  # Rationale for this polish config specifically:
  #   - WSD matches "preserve the basin" goal better than OneCycle (no LR
  #     spike that washes out the bf16-trained solution).
  #   - Muon's orthogonalized updates on 2-D weights combine well with fp32
  #     precision: Newton-Schulz runs in the parameter's native dtype, so
  #     with encoder_autocast_dtype=float32 the whole NS iteration is fp32 →
  #     gradient precision on the critical SSM in_proj / out_proj matrices
  #     is preserved end-to-end, which is the whole point of this polish.
  #   - LRs are HALF of Run C's since this is a polish, not a re-train.
  #     AdamW group peak 5e-5 (Run C: 1e-4), Muon group peak 1.5e-4 (Run C:
  #     3e-4). Kept the 3× AdamW:Muon LR ratio from Muon literature.
  optimizer: MuonHybrid
  lrs_config:
    schedule: wsd
    # AdamW group (1-D params, input/pool/output heads)
    initial: 5.0e-06       # start of warmup for AdamW group
    max: 5.0e-05           # polish peak — half of Run C's 1e-4
    end: 5.0e-07           # final LR after cooldown
    weight_decay: 0.02     # matches Run C (dropped from default for Lion-pretrain compat)
    betas: [0.9, 0.95]
    # Muon group (2-D interior weights)
    muon_max: 1.5e-04      # polish peak — half of Run C's 3e-4 (preserves 3× AdamW ratio)
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_ns_steps: 5
    # Schedule shape
    pct_start: 0.02        # 2% warmup, matches Run C
    decay_pct: 0.15        # 15% cosine cooldown, matches Run C
    skip_scheduler: false

  model:
    init_args:
      pool: ssm_state
      # The critical line: "float32" short-circuits torch.amp.autocast in
      # TrackParameterRegressor.forward (see model.py L413-419), so the
      # encoder and every op inside it stays in fp32 — A_log, dt_bias, D,
      # the selective-scan, and the post-SSM RMSNorm.
      encoder_autocast_dtype: float32
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          # Smaller chunk_size forces more frequent fp32 cross-chunk
          # reductions on top of the fully-fp32 compute — redundant if the
          # kernel is already fp32, cheap insurance if it silently falls
          # back to a mixed-precision path internally.
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/p200_core_finetune
  load_acts: true
  # Batch size reduced vs the normal finetune because fp32 encoder roughly
  # doubles activation memory.  Keep it large enough that val metrics are
  # stable across a single sanity check.
  batch_size: 30000
  num_workers: 1
  streaming: true
  shard_buffer_size: 50
