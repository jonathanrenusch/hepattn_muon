# =============================================================================
# SSM (Mamba-2 state) + Q7 safety — FP32 pretrain on p0
# =============================================================================
# Safety-net fallback for the NeurIPS deadline:
#   - FP32 precision (encoder autocast to bf16 for Mamba-2 Triton kernels;
#     heads, loss, metrics all run in full precision)
#   - 7 quantiles [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95] (proven stable)
#   - phi: circular loss with beta=0.01
#   - qop tail weighting on (qop_tail_weight=1.5, qop_scale=2.0)
# =============================================================================

trainer:
  devices: [1]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-v2-SSM-Q7-FP32-Loose-pretrain
      project_name: colliderml-track-regression
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      pool: ssm_state
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -5.0
              norm_max: 5.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -5.0
              norm_max: 5.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/p0_loose_pretrain
  batch_size: 2048
  num_workers: 16
