# =============================================================================
# Alt Study 3 — Spline + Quantile Regression (hit-filtering encoder config)
# =============================================================================
# Quantile regression in spline-normalised [0,1] space, using the d_state=32 /
# headdim=32 / dropout=0.0 encoder from the hit-filtering project.
# Dense heads are proportionally scaled for the halved state dimension.
#
# Usage:  python train.py fit --config config/alt_study3_spline_quantile.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [1]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Alt-Study3-Spline-Quantile
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- Alt architecture overrides (from hit-filtering project) ---
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.0
      # --- Loss ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_d0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_z0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_theta.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_qop.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
