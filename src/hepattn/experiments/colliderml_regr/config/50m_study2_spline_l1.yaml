# =============================================================================
# 50M Study 2 — Spline + Smooth-L1 (~49.5M parameters)
# =============================================================================
# Regression in quantile-spline-normalised [0,1] space using the 50M-class
# architecture:
#   - dim=256, 16 bidirectional Mamba-2 layers, d_state=64
#   - 3-layer dense heads for progressive state compression
#   - Spline normalisation equalises loss sensitivity across parameter ranges
#
# Usage:  python train.py fit --config config/50m_study2_spline_l1.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-50M-Study2-Spline-L1
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- 50M architecture ---
      dim: 256
      state_head_output_dim: 256
      state_head_hidden_layers: [512, 384, 256]
      state_head_dropout: 0.1
      state_head_activation: SiLU
      output_head_hidden_layers: [256, 192, 128]
      output_head_dropout: 0.05
      output_head_activation: SiLU
      input_net_hidden_layers: [192, 256]
      input_net_dropout: 0.0
      input_net_activation: SiLU
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 16
          dim: 256
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 64
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # --- Loss ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_d0.yaml
              beta: 0.1
            z0:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_z0.yaml
              beta: 0.1
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_theta.yaml
              beta: 0.1
            qop:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_qop.yaml
              beta: 0.1

  # Scaled LR for 50M model
  lrs_config:
    initial: 5.0e-06
    max: 2.0e-05
    end: 5.0e-07
    pct_start: 0.10
    weight_decay: 2.0e-05
    skip_scheduler: false

  optimizer: Lion
