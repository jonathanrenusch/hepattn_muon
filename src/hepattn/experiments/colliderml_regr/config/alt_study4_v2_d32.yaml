# =============================================================================
# Alt Study 4 v2 — Direct Quantile, d_state=32, improved training recipe
# =============================================================================
# Key changes vs alt_study4_direct_quantile.yaml:
#   - AdamW optimizer with betas=(0.9, 0.95) and weight_decay=0.1
#   - Cosine LR schedule with warmup, max_lr=3e-4
#   - 8-GPU DDP training, batch_size=20000 per GPU
#   - 200 epochs, grad_clip=1.0
#   - Loss weights: d0=0.5, theta=3.0, qop=2.0 (prioritise lagging params)
#
# Usage:  python train.py fit --config config/alt_study4_v2_d32.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: -1
  strategy: ddp
  max_epochs: 200
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Alt-Study4-V2-D32
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 40
        min_delta: 0.0
        mode: min
        verbose: true

model:
  optimizer: AdamW
  lrs_config:
    initial: 1.0e-05
    max: 3.0e-04
    end: 1.0e-06
    pct_start: 0.05
    weight_decay: 0.1
    schedule: cosine
    betas: [0.9, 0.95]
    skip_scheduler: false
  model:
    init_args:
      # --- Alt architecture (d_state=32) ---
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # --- Loss with adjusted weights ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.5
              norm_min: -1.0
              norm_max: 1.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 3.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 2.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  batch_size: 25000
  num_workers: 12
