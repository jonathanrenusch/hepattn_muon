# =============================================================================
# Inference config — d_state=32 checkpoint evaluation
# =============================================================================
# Run batched test inference with RegressionPredictionWriter, then evaluate:
#
#   cd /shared/tracking/hepattn_muon/src
#   pixi run python -m hepattn.experiments.colliderml_regr.train test \
#       --config config/infer_d32.yaml \
#       --ckpt_path /path/to/epoch=049-val_total=0.00744.ckpt
#
# Output: logs/infer_d32/test_predictions.h5
# Then:   pixi run python -m hepattn.experiments.colliderml_regr.evaluate_predictions \
#             --predictions logs/infer_d32/test_predictions.h5
#
# For a quick debug run add: --trainer.limit_test_batches 5
# =============================================================================

ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ckpts/epoch=049-val_total=0.00744.ckpt

trainer:
  devices: [0]
  default_root_dir: logs/infer_d32
  logger: false          # no CometML overhead during inference
  enable_progress_bar: true
  # Override callbacks to the bare minimum — only the prediction writer
  callbacks:
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  model:
    init_args:
      # Architecture identical to alt_study4_direct_quantile.yaml
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.0   # no dropout during inference
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  batch_size: 25000    # safe ceiling: 30K works, 40K hits Mamba-2 kernel limit
  num_workers: 12
  pin_memory: true
