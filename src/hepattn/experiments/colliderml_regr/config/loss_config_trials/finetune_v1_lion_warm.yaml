# =============================================================================
# Fine-tune v1 — Lion warm restart from epoch-49 d32 checkpoint
# =============================================================================
# Loads model weights only (fresh optimizer + scheduler) from the best d32
# checkpoint.  Uses a high-LR OneCycleLR warm restart with:
#   - 3x higher peak LR than original training (Lion warm-restart effect)
#   - 10x lower weight decay (less regularisation, encourage further fitting)
#   - Upweighted theta/qop losses (lagging parameters per Comet logs)
#   - Slightly smaller batch for extra gradient updates per epoch
#   - Tighter gradient clipping for stable fine-tuning
#
# Usage:
#   python train.py fit --config config/finetune_v1_lion_warm.yaml
#
# NOTE: Do NOT pass --ckpt_path; weights are loaded via pretrained_ckpt_path.
# =============================================================================

trainer:
  devices: [0]
  max_epochs: 100
  gradient_clip_val: 1.0
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-FT-v1-LionWarm
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true

model:
  # Load weights only — optimizer and LR schedule start fresh
  pretrained_ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ckpts/epoch=049-val_total=0.00744.ckpt
  optimizer: Lion
  lrs_config:
    initial: 5.0e-06     # warm-up start (very low)
    max: 3.0e-04         # 6× original max — aggressive warm restart peak
    end: 1.0e-06         # final annealed LR
    pct_start: 0.05      # 5 % warmup (5 epochs)
    weight_decay: 1.0e-04  # 10× lower than original — less regularisation
    skip_scheduler: false
    schedule: onecycle

  model:
    init_args:
      # Architecture must be identical to the checkpoint (d_state=32, headdim=32)
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # Loss: down-weight d0 (already beats baseline), up-weight theta+qop (lagging)
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          qop_tail_weight: 1.5   # up-weight high-|qop| tracks; 0 = off (default in base configs)
          qop_scale: 2.0         # matches qop norm_max
          config:
            d0:
              type: quantile
              weight: 0.7         # slightly down — already 0.049 vs 0.13 mm baseline
              norm_min: -1.0
              norm_max: 1.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 2.0         # 2× — still converging, 4.83 vs 2.2 mrad target
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.5         # 1.5× — lagging (0.0096 vs 0.0057 1/GeV target)
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  batch_size: 15000
  num_workers: 8
