# =============================================================================
# Alt Study 1 — Baseline Smooth-L1 (hit-filtering encoder config)
# =============================================================================
# Direct regression with Smooth-L1 loss, using the d_state=32 / headdim=32 /
# dropout=0.0 encoder that worked well on the hit-filtering task.
# Dense heads are proportionally scaled for the halved state dimension.
#
# Usage:  python train.py fit --config config/alt_study1_baseline_smooth_l1.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Alt-Study1-Baseline-SmoothL1
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- Alt architecture overrides (from hit-filtering project) ---
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # --- Loss ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: smooth_l1
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              beta: 0.3
            z0:
              type: smooth_l1
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              beta: 0.3
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: smooth_l1
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              beta: 0.3
            qop:
              type: smooth_l1
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              beta: 0.3
