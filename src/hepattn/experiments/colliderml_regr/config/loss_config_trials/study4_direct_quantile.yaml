# =============================================================================
# Study 4 — Direct Quantile Regression
# =============================================================================
# Quantile regression directly on linearly normalised physical targets.
# - d0, z0, theta, qop: QuantileLoss (per-quantile direct prediction)
# - phi: CircularPhiLoss (sin/cos decomposition)
#
# No spline transform — provides uncertainty estimates without the
# distribution equalisation. Comparison with Study 3 isolates the
# contribution of the spline transform.
#
# Usage:  python train.py fit --config config/study4_direct_quantile.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Study4-Direct-Quantile
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
