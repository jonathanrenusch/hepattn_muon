# =============================================================================
# 50M Study 1 — Baseline Smooth-L1 (~49.5M parameters)
# =============================================================================
# Direct regression with Smooth-L1 loss using the 50M-class architecture:
#   - dim=256, 16 bidirectional Mamba-2 layers, d_state=64
#   - 3-layer dense heads for progressive state compression
#   - Reduced learning rate scaled for model size
#
# Usage:  python train.py fit --config config/50m_study1_baseline_smooth_l1.yaml
# (base.yaml is loaded automatically)
# =============================================================================

ckpt_path: /shared/tracking/hepattn_muon/src/logs/comet_offline/ckpts/epoch=003-val_total=0.02752.ckpt

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-50M-Study1-Baseline-SmoothL1
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- 50M architecture ---
      dim: 256
      state_head_output_dim: 256
      state_head_hidden_layers: [512, 384, 256]
      state_head_dropout: 0.1
      state_head_activation: SiLU
      output_head_hidden_layers: [256, 192, 128]
      output_head_dropout: 0.05
      output_head_activation: SiLU
      input_net_hidden_layers: [192, 256]
      input_net_dropout: 0.0
      input_net_activation: SiLU
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 16
          dim: 256
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 64
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # --- Loss ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: smooth_l1
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              beta: 0.3
            z0:
              type: smooth_l1
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              beta: 0.3
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: smooth_l1
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              beta: 0.3
            qop:
              type: smooth_l1
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              beta: 0.3

  # Scaled LR for 50M model
  lrs_config:
    initial: 5.0e-06
    max: 2.0e-05
    end: 5.0e-07
    pct_start: 0.15
    weight_decay: 1.0e-03
    skip_scheduler: false

  optimizer: Lion

data:
  batch_size: 4096
