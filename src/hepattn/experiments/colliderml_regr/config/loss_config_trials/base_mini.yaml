# =============================================================================
# Mini base config — ~1.4M parameter model for rapid iteration
# =============================================================================
# Loaded as an overlay on top of base.yaml (which is auto-loaded by train.py):
#
#   python train.py fit --config config/base_mini.yaml \
#                       --config config/mini_study1_baseline_smooth_l1.yaml
#
# Overrides the model architecture (dim, encoder depth, head sizes) while
# inheriting trainer, callbacks, data, LR schedule, etc. from base.yaml.
# =============================================================================

model:
  model:
    init_args:
      dim: 64
      # Per-direction state projection heads (smaller for ~4k state dim)
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      state_head_dropout: 0.1
      # Final output head
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      # Input embedding — single linear projection (no hidden layer)
      input_net_hidden_layers: []
      input_net_dropout: 0.0

      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 4
          dim: 64
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
