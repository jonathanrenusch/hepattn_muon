# =============================================================================
# Study 2 — Spline + Smooth-L1
# =============================================================================
# Regression in quantile-spline-normalised [0,1] space.
# - d0, z0, theta, qop: SplineL1Loss (model predicts logit, sigmoid → spline)
# - phi: CircularPhiLoss (sin/cos decomposition)
#
# The spline transform equalises the target distribution so that the loss
# gives equal weight across the full dynamic range.
#
# Usage:  python train.py fit --config config/study2_spline_l1.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Study2-Spline-L1
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_d0.yaml
              beta: 0.3
            z0:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_z0.yaml
              beta: 0.3
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_theta.yaml
              beta: 0.3
            qop:
              type: spline_l1
              weight: 1.0
              spline_config: config/splines/spline_qop.yaml
              beta: 0.3
