# =============================================================================
# P200 Study 4 — Direct Quantile Regression on pileup-200 soft-scatter tracks
# =============================================================================
# Clone of alt_study4_direct_quantile_AdamW_scaling.yaml with:
#   - P200 compact preprocessed data (soft-scatter, pt_min=0.2, wider perigee)
#   - Wider target normalization for d0 ([-5,5]), z0 ([-200,200]), qop ([-5,5])
#   - ACTS live comparison enabled (load_acts: true)
#   - SwiGLU activation in all dense heads
#
# Usage:  python train.py fit --config config/p200_study4_direct_quantile_AdamW_scaling.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  max_epochs: 100
  devices: -1
  precision: bf16-mixed
  strategy: ddp
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-P200-Study4-Direct-Quantile-AdamW-Scaling-d32-SwiGLU-4GPU
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- Alt architecture overrides (from hit-filtering project) ---
      dim: 128
      state_head_output_dim: 128
      state_head_hidden_layers: [192]
      state_head_dropout: 0.0
      state_head_activation: SwiGLU
      output_head_hidden_layers: [256]
      output_head_dropout: 0.0
      output_head_activation: SwiGLU
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      input_net_activation: SwiGLU
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.0

      # --- Loss (wider norm ranges for softer selection cuts) ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.5
              norm_min: -5.0
              norm_max: 5.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 10.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -5.0
              norm_max: 5.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  lrs_config:
    initial: 1.0e-05
    max: 1.5e-03
    end: 1.0e-06
    pct_start: 0.15
    weight_decay: 1.0e-02
    skip_scheduler: false
    betas: [0.8, 0.95]
    eps: 1.0e-08

  optimizer: AdamW

# Designed for training on H100 GPUs with max batch size
data:
  preprocessed_dir: /eos/project/e/end-to-end-colliderml/data/p200_preprocessed_plus_qcd
  batch_size: 30000
  num_workers: 4
  load_acts: true
