# Quick test config — no logger, no checkpointing
# Usage:  python train.py fit --config config/test_quick.yaml
# (base.yaml is loaded automatically — this config overrides for quick testing)

trainer:
  strategy: auto
  devices: [0]
  max_epochs: 2
  gradient_clip_val: 0.1
  log_every_n_steps: 10
  logger: false
  enable_checkpointing: false
  default_root_dir: /tmp/test_train
  callbacks: []

model:
  model:
    init_args:
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: smooth_l1
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              beta: 0.1
            z0:
              type: smooth_l1
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              beta: 0.1
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: smooth_l1
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              beta: 0.1
            qop:
              type: smooth_l1
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              beta: 0.1

  lrs_config:
    max: 5.0e-04
    weight_decay: 1.0e-04

  optimizer: AdamW

data:
  batch_size: 2048
  num_workers: 2
  num_train_shards: 2  # small subset for quick testing
