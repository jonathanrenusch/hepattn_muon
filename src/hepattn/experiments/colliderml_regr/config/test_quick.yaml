# Quick test config — no logger, no checkpointing
seed_everything: 42

trainer:
  accelerator: gpu
  strategy: auto
  devices: [0]
  precision: bf16-mixed
  max_epochs: 2
  gradient_clip_val: 0.1
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  deterministic: false
  benchmark: true
  logger: false
  enable_checkpointing: false
  default_root_dir: /tmp/test_train

model:
  model:
    class_path: hepattn.experiments.colliderml_regr.model.TrackParameterRegressor
    init_args:
      input_dim: 12
      dim: 128
      # Per-direction state projection heads (fwd / bwd SSM states)
      state_head_output_dim: 256
      state_head_hidden_layers: [384]
      state_head_dropout: 0.1
      state_head_activation: SiLU
      # Final output head (combines projected fwd + bwd → targets)
      output_head_hidden_layers: [256]
      output_head_dropout: 0.0
      output_head_activation: SiLU
      # Input embedding network
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      input_net_activation: SiLU
      sort_field: s
      fourier_scales: [-3, -2, -1, 0, 1, 2, 3]
      fourier_base: 3
      norm_min: [-1031.0, -1031.0, -3026.0, 31.0, -3.1416, 0.027, 31.0, 16.0, 2.0, 1.0, 0.0, -4.3]
      norm_max: [1031.0, 1031.0, 3026.0, 1032.0, 3.1416, 3.114, 3185.0, 30.0, 16.0, 3360.0, 8.0, 4.3]
      input_fields:
        - x
        - y
        - z
        - r
        - phi_hit
        - theta_hit
        - s
        - volume_id
        - layer_id
        - surface_id
        - detector
        - eta_hit

      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 64
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05

      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: smooth_l1
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              beta: 0.1
            z0:
              type: smooth_l1
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              beta: 0.1
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: smooth_l1
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              beta: 0.1
            qop:
              type: smooth_l1
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              beta: 0.1

  lrs_config:
    initial: 1.0e-05
    max: 5.0e-04
    end: 1.0e-06
    pct_start: 0.05
    weight_decay: 1.0e-04
    skip_scheduler: false

  optimizer: AdamW

data:
  preprocessed_dir: /scratch/colliderml/p0_preprocessed_test
  batch_size: 2048
  num_workers: 2
  pin_memory: true
  train_frac: 0.5
  val_frac: 0.5
  max_hits: 50
  bucketed_sampling: true
  num_shards: 2
