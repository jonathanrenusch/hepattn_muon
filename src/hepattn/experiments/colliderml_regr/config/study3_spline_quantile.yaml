# =============================================================================
# Study 3 — Spline + Quantile Regression
# =============================================================================
# Quantile regression in spline-normalised [0,1] space.
# - d0, z0, theta, qop: SplineQuantileLoss (per-quantile logits → sigmoid)
# - phi: CircularPhiLoss (sin/cos decomposition)
#
# Combines distribution-equalising spline transform with uncertainty-aware
# quantile regression. Median (0.5) = point prediction, other quantiles
# provide calibrated prediction intervals.
#
# Usage:  python train.py fit --config config/study3_spline_quantile.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [0]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Study3-Spline-Quantile
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_d0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_z0.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_theta.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_qop.yaml
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
