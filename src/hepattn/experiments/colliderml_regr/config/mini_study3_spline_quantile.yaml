# =============================================================================
# Mini Study 3 — Spline-normalised quantile regression (~1.4M params)
# =============================================================================
# Usage:  python train.py fit --config config/mini_study3_spline_quantile.yaml
# (base.yaml is loaded automatically)
# =============================================================================

trainer:
  devices: [1]
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Mini-Study3-Spline-Quantile
      offline_directory: logs/comet_offline

model:
  model:
    init_args:
      # --- Mini architecture overrides (from base_mini.yaml) ---
      dim: 64
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      state_head_dropout: 0.1
      output_head_hidden_layers: [128]
      output_head_dropout: 0.0
      input_net_hidden_layers: []
      input_net_dropout: 0.0
      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 4
          dim: 64
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05
      # --- Loss ---
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_d0.yaml
              quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
            z0:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_z0.yaml
              quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_theta.yaml
              quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
            qop:
              type: spline_quantile
              weight: 1.0
              spline_config: config/splines/spline_qop.yaml
              quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
