# =============================================================================
# Study 4 — Direct Quantile Regression
# =============================================================================
# Quantile regression directly on linearly normalised physical targets.
# - d0, z0, theta, qop: QuantileLoss (per-quantile direct prediction)
# - phi: CircularPhiLoss (sin/cos decomposition)
#
# No spline transform — provides uncertainty estimates without the
# distribution equalisation. Comparison with Study 3 isolates the
# contribution of the spline transform.
# =============================================================================

seed_everything: 42

# ---- Trainer ----------------------------------------------------------------

trainer:
  max_epochs: 50
  num_sanity_val_steps: 1
  accelerator: gpu
  devices: [2]
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 1.0
  enable_progress_bar: true
  deterministic: false
  benchmark: true

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-Study4-Direct-Quantile
      offline_directory: logs/comet_offline

  callbacks:
    # NOTE: torch.compile is incompatible with mamba-ssm CUDA kernels
    # - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 15
        min_delta: 0.0
        mode: min
        verbose: true

# ---- Model ------------------------------------------------------------------

model:
  model:
    class_path: hepattn.experiments.colliderml_regr.model.TrackParameterRegressor
    init_args:
      input_dim: 12
      dim: 128
      # Per-direction state projection heads (fwd / bwd SSM states)
      state_head_output_dim: 256
      state_head_hidden_layers: [384]
      state_head_dropout: 0.1
      state_head_activation: SiLU
      # Final output head (combines projected fwd + bwd → targets)
      output_head_hidden_layers: [256]
      output_head_dropout: 0.0
      output_head_activation: SiLU
      # Input embedding network
      input_net_hidden_layers: [128]
      input_net_dropout: 0.0
      input_net_activation: SiLU
      sort_field: s
      fourier_scales: [-3, -2, -1, 0, 1, 2, 3]
      fourier_base: 3
      norm_min: [-1031.0, -1031.0, -3026.0, 31.0, -3.1416, 0.027, 31.0, 16.0, 2.0, 1.0, 0.0, -4.3]
      norm_max: [1031.0, 1031.0, 3026.0, 1032.0, 3.1416, 3.114, 3185.0, 30.0, 16.0, 3360.0, 8.0, 4.3]
      input_fields:
        - x
        - y
        - z
        - r
        - phi_hit
        - theta_hit
        - s
        - volume_id
        - layer_id
        - surface_id
        - detector
        - eta_hit

      encoder:
        class_path: hepattn.experiments.colliderml_regr.mamba_state.BidirectionalMambaEncoder
        init_args:
          num_layers: 8
          dim: 128
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 64
          ngroups: 1
          chunk_size: 256
          norm: LayerNorm
          dropout: 0.05

      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -1.0
              norm_max: 1.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -150.0
              norm_max: 150.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile
              weight: 1.0
              norm_min: 0.0
              norm_max: 3.141592653589793
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.05
    weight_decay: 1.0e-05
    skip_scheduler: false

  optimizer: Lion

# ---- Data -------------------------------------------------------------------

data:
  preprocessed_dir: /scratch/colliderml/p0_preprocessed
  batch_size: 2048
  num_workers: 12
  pin_memory: true
  train_frac: 0.9
  val_frac: 0.05
  max_hits: 20
  bucketed_sampling: true
  num_shards: -1
