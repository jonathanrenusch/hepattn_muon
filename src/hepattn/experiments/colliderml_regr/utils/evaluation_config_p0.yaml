# ACTS Track Reconstruction Evaluation Configuration
# ==================================================

# Data settings
data:
  directory: "/eos/project/e/end-to-end-muon-tracking/tracking/colliderml/p0/CERN__ColliderML-Release-1"
  # Evaluate on the held-out test split (shards 950–999, 50 shards × 1000 events = 50k events).
  # When shard_indices is present it takes precedence over n_events + sampling.
  shard_indices: [950, 951, 952, 953, 954, 955, 956, 957, 958, 959,
                  960, 961, 962, 963, 964, 965, 966, 967, 968, 969,
                  970, 971, 972, 973, 974, 975, 976, 977, 978, 979,
                  980, 981, 982, 983, 984, 985, 986, 987, 988, 989,
                  990, 991, 992, 993, 994, 995, 996, 997, 998, 999]
  # n_events/sampling ignored when shard_indices is set (kept for fallback use)
  n_events: 50000
  random_seed: 42
  sampling: sequential

# Output settings
output:
  directory: "/shared/tracking/logs/acts_tracking_evaluation_p0"

# Binning configuration for eta-dependent plots
binning:
  # Pseudorapidity binning
  eta_range: [-4.0, 4.0]
  n_eta_bins: 30
  
  # pT binning for resolution studies [GeV]
  pt_range: [0.5, 100.0]
  n_pt_bins: 30

# Efficiency calculation settings
efficiency:
  # Minimum number of hits for a particle to be considered reconstructible
  min_hits: 6
  
  # Minimum energy for reconstructible particles [GeV]
  min_energy: 0.5

# Matching settings
matching:
  # Use majority_particle_id from ACTS tracks
  use_majority_id: true

# Residual histogram settings
residuals:
  d0:
    bins: 100
    range: [-0.5, 0.5]  # mm
    xlabel: "$d_0$ residual [mm]"
  
  z0:
    bins: 100
    range: [-2.0, 2.0]  # mm
    xlabel: "$z_0$ residual [mm]"
  
  phi:
    bins: 100
    range: [-0.01, 0.01]  # rad
    xlabel: "$\\phi$ residual [rad]"
  
  theta:
    bins: 100
    range: [-0.01, 0.01]  # rad
    xlabel: "$\\theta$ residual [rad]"
  
  qop:
    bins: 100
    range: [-0.1, 0.1]  # 1/GeV
    xlabel: "$q/p$ residual [1/GeV]"
  
  pt_rel:
    bins: 100
    range: [-0.2, 0.2]  # relative
    xlabel: "$(p_T^{reco} - p_T^{truth}) / p_T^{truth}$"

# Pull distribution settings (for validation of uncertainties)
pulls:
  expected_mean: 0.0
  expected_std: 1.0

# Plot aesthetics
plot:
  figsize: [10, 8]
  dpi: 150
  title_fontsize: 14
  label_fontsize: 12
  legend_fontsize: 10
  
  # Colors
  efficiency_color: "#2ca02c"
  fake_color: "#d62728"
  residual_color: "#1f77b4"
  resolution_color: "#ff7f0e"

# Track parameter names and units for labeling
parameters:
  d0:
    name: "Transverse Impact Parameter"
    symbol: "$d_0$"
    unit: "mm"
  
  z0:
    name: "Longitudinal Impact Parameter"
    symbol: "$z_0$"
    unit: "mm"
  
  phi:
    name: "Azimuthal Angle"
    symbol: "$\\phi$"
    unit: "rad"
  
  theta:
    name: "Polar Angle"
    symbol: "$\\theta$"
    unit: "rad"
  
  qop:
    name: "Charge over Momentum"
    symbol: "$q/p$"
    unit: "1/GeV"
  
  pt:
    name: "Transverse Momentum"
    symbol: "$p_T$"
    unit: "GeV"
  
  eta:
    name: "Pseudorapidity"
    symbol: "$\\eta$"
    unit: ""

# PDG particle names (for particle composition plots)
pdg_names:
  11: "e⁻"
  -11: "e⁺"
  13: "μ⁻"
  -13: "μ⁺"
  211: "π⁺"
  -211: "π⁻"
  321: "K⁺"
  -321: "K⁻"
  2212: "p"
  -2212: "p̄"
