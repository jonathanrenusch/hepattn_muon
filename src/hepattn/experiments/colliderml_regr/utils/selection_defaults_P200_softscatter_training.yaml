# ============================================================================
# Shared particle selection criteria for ColliderML preprocessing & evaluation
# ============================================================================
#
# This file is the single source of truth for particle selection cuts used
# across preprocessing (preprocess_colliderml.py), data exploration
# (explore_colliderml.py), and tracking evaluation (evaluate_acts_tracking.py).
#
# All scripts import these defaults via load_selection_defaults().

selection:
  min_hits: 3
  max_hits: 20
  primary: true
  hard_scatter: false      # vertex_primary == 1
  charged: true           # charge != 0
  pt_min: 0.2           # GeV
  eta_min: -3.0
  eta_max: 3.0
  d0_min: -5.0            # mm
  d0_max: 5.0             # mm
  z0_min: -200.0          # mm
  z0_max: 200.0           # mm
  require_pixel_strip: false  # no per-detector-type hit requirements
  min_pixel_hits: 0
  min_strip_hits: 0
